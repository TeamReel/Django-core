name: Tests

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        django-version: ['5.1']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_django_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client gettext

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/local.txt

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_django_core
        SECRET_KEY: test-secret-key-for-ci-minimum-50-characters-long
        DJANGO_SETTINGS_MODULE: config.settings.local
      run: |
        cd src
        python manage.py migrate --noinput

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_django_core
        SECRET_KEY: test-secret-key-for-ci-minimum-50-characters-long
        DJANGO_SETTINGS_MODULE: config.settings.local
      run: |
        cd src
        pytest ../tests/accounts/ --cov=accounts --cov-report=xml --cov-report=term-missing -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./src/coverage.xml
        flags: accounts
        name: accounts-coverage
        fail_ci_if_error: false

    - name: Check coverage threshold
      run: |
        cd src
        pytest ../tests/accounts/ --cov=accounts --cov-fail-under=80 --cov-report=term-missing -q
