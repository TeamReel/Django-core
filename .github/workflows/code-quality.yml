name: Code Quality

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black mypy

    - name: Get changed files
      id: changed-files
      if: github.event_name == 'pull_request'
      uses: tj-actions/changed-files@v44
      with:
        files: |
          src/**/*.py
          tests/**/*.py

    - name: Run Black (PR - changed files only)
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"
        black --check ${{ steps.changed-files.outputs.all_changed_files }}

    - name: Run Black (Push - all files)
      if: github.event_name == 'push'
      run: |
        black --check src/ tests/

    - name: Run Ruff (PR - changed files only)
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      run: |
        ruff check ${{ steps.changed-files.outputs.all_changed_files }}

    - name: Run Ruff (Push - all files)
      if: github.event_name == 'push'
      run: |
        ruff check src/ tests/

    - name: Run mypy (optional)
      continue-on-error: true
      run: |
        mypy src/

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Get changed files for security scan
      id: changed-python-files
      if: github.event_name == 'pull_request'
      uses: tj-actions/changed-files@v44
      with:
        files: |
          src/**/*.py

    - name: Run Bandit security scan (PR - changed files only)
      if: github.event_name == 'pull_request' && steps.changed-python-files.outputs.any_changed == 'true'
      run: |
        echo "Scanning changed files: ${{ steps.changed-python-files.outputs.all_changed_files }}"
        bandit -ll ${{ steps.changed-python-files.outputs.all_changed_files }} || true
        bandit -r src/ -ll -f json -o bandit-report.json || true

    - name: Run Bandit security scan (Push - all files)
      if: github.event_name == 'push'
      run: |
        bandit -r src/ -ll -f json -o bandit-report.json
        bandit -r src/ -ll

    - name: Run Safety check
      continue-on-error: true
      run: |
        safety check --json

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
