apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: your-registry/django-core:latest
        command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "config.settings.production"
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: redis-connection
              key: broker-url
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: redis-connection
              key: result-backend
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - config
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - config
            - inspect
            - ping
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
