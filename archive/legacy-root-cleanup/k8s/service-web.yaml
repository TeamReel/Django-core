# Kubernetes Service - Django Web (LoadBalancer)
# B19 Deployment Templates & Configuration
#
# Purpose: Expose Django web tier to external traffic
# Usage: kubectl apply -f service-web.yaml

apiVersion: v1
kind: Service
metadata:
  name: django-web-service
  namespace: default
  labels:
    app: django-core
    component: web
  annotations:
    # Cloud provider annotations (uncomment as needed)

    # AWS ELB annotations
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:region:account:certificate/id"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"

    # GCP Load Balancer annotations
    # cloud.google.com/load-balancer-type: "External"
    # cloud.google.com/backend-config: '{"default": "django-backend-config"}'

    # Azure Load Balancer annotations
    # service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer  # Use NodePort for on-prem or development
  selector:
    app: django-core
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http  # Maps to container port 8000
    # Uncomment for HTTPS (requires SSL termination at load balancer)
    # - name: https
    #   protocol: TCP
    #   port: 443
    #   targetPort: http
  sessionAffinity: None  # Use ClientIP if sticky sessions needed

  # Load balancer health check configuration
  # healthCheckNodePort: 30000  # For externalTrafficPolicy: Local only

---
# Service Notes:
# - Type: LoadBalancer provisions cloud load balancer (AWS ELB, GCP LB, Azure LB)
# - For on-prem: Change type to NodePort and use Ingress controller
# - Port 80 maps to container port 8000 (Gunicorn)
# - Session affinity: None (stateless web tier, sticky sessions not needed)
# - Health checks: Cloud LB uses readiness probe from Deployment
#
# Cloud Provider Setup:
# AWS:
#   - Automatically provisions Classic ELB or Network Load Balancer
#   - Use annotations for NLB, SSL termination, health check config
#   - Requires IAM permissions for ELB creation
#
# GCP:
#   - Automatically provisions TCP/UDP Load Balancer
#   - Use BackendConfig for advanced features (CDN, IAP, custom health checks)
#   - Requires firewall rules for health check IPs
#
# Azure:
#   - Automatically provisions Azure Load Balancer
#   - Use annotations for internal LB, static IP, etc.
#
# Alternative: Ingress Controller
# For more control (path-based routing, SSL termination, rate limiting):
#   - Install Nginx Ingress Controller or Traefik
#   - Change Service type to ClusterIP
#   - Create Ingress resource (see ingress-web.yaml for example)
