# Docker Compose - Staging Environment
# B19 Deployment Templates & Configuration
#
# Purpose: Production-like environment with safer defaults and full observability
# Usage: docker-compose -f docker-compose.staging.yml up -d

version: '3.9'

services:
  # PostgreSQL Database (staging - local but production-configured)
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-django_core_staging}
      POSTGRES_USER: ${DATABASE_USER:-django_staging}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD required}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-django_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Broker (staging)
  redis:
    image: redis:6-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migration (runs before web starts)
  migrate:
    image: ${DOCKER_IMAGE:-django-core:latest}
    command: python manage.py migrate --noinput
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - DATABASE_URL=postgresql://${DATABASE_USER:-django_staging}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-django_core_staging}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Django Web Application (staging)
  web:
    image: ${DOCKER_IMAGE:-django-core:latest}
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class sync
      --max-requests 1000
      --max-requests-jitter 50
      --timeout 30
      --access-logfile -
      --error-logfile -
      --log-level info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - DATABASE_URL=postgresql://${DATABASE_USER:-django_staging}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-django_core_staging}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - SECURE_SSL_REDIRECT=False  # Staging: HTTP acceptable
      - SESSION_COOKIE_SECURE=False
      - CSRF_COOKIE_SECURE=False
      - LOGGING_LEVEL=INFO
      - PROMETHEUS_METRICS_ENABLED=True
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Nginx Reverse Proxy (staging)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Celery Worker (staging)
  celery-worker:
    image: ${DOCKER_IMAGE:-django-core:latest}
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - DATABASE_URL=postgresql://${DATABASE_USER:-django_staging}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-django_core_staging}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOGGING_LEVEL=INFO
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Celery Beat Scheduler (staging - single instance)
  celery-beat:
    image: ${DOCKER_IMAGE:-django-core:latest}
    command: celery -A config beat --loglevel=info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY required}
      - DATABASE_URL=postgresql://${DATABASE_USER:-django_staging}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME:-django_core_staging}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOGGING_LEVEL=INFO
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Prometheus (optional - for testing B18 metrics integration)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

volumes:
  postgres_data_staging:
  redis_data_staging:
  static_volume:
  prometheus_data:

# Staging Environment Notes:
# - Production-like configuration but with safer defaults
# - DEBUG=False to catch production-only issues
# - Local PostgreSQL/Redis (not external) for isolation
# - Nginx reverse proxy included for realistic routing
# - Full observability: health checks, metrics, structured logging
# - Optional Prometheus for testing B18 integration
# - Migration runs as separate service before web starts
# - Requires .env file with: SECRET_KEY, DATABASE_PASSWORD, REDIS_PASSWORD
