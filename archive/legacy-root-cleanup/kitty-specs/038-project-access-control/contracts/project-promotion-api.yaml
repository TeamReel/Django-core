openapi: 3.1.0
info:
  title: Project Membership Promotion API
  version: 1.0.0
  description: |
    API endpoints for managing role promotions requiring admin acceptance.
    Part of B26 Project-Level Access Control feature.

    **Key Capabilities:**
    - Request role elevation (viewer/editor → admin)
    - Accept/decline promotion requests
    - List pending promotions (for target users and project admins)
    - Automatic expiry after 7 days
    - Suspicious promotion detection and alerts

    **Integrations:**
    - B16 Notifications (acceptance requests, suspicious alerts)
    - B09 Audit Logging (promotion lifecycle events)
    - B10 Feature Flags (`project_access_control.require_promotion_approval`, `.promotion_approval_threshold`)

servers:
  - url: https://api.core-app.railway.app/api/v1
    description: Production (Railway)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Promotions
    description: Role elevation with approval workflow

paths:
  /projects/{project_id}/promotions:
    get:
      summary: List promotions (context-aware)
      description: |
        Retrieve promotion requests based on user context.

        **Permission Required:** Varies by context
        - Project admin: See all promotions for project
        - Regular user: See only promotions where they are target user

        **Rate Limit:** 100 requests/minute (per user)
      operationId: listProjectPromotions
      tags:
        - Promotions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined, expired]
          description: "Filter by status (default: pending)"
        - name: target_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by target user (admin only)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMembershipPromotionRead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                pending_promotions:
                  value:
                    data:
                      - id: "pr123456-abcd-ef12-3456-7890abcdef12"
                        project:
                          id: "p1234567-abcd-ef12-3456-7890abcdef12"
                          name: "Premier League 2025/26"
                        target_user:
                          id: "u2345678-bcde-f123-4567-890abcdef123"
                          full_name: "Bob Smith"
                          email: "bob@example.com"
                        requested_by:
                          id: "u1234567-abcd-ef12-3456-7890abcdef12"
                          full_name: "Alice Johnson"
                        from_role: "editor"
                        to_role: "admin"
                        status: "pending"
                        is_suspicious: false
                        created_at: "2026-01-04T10:00:00Z"
                        expires_at: "2026-01-11T10:00:00Z"
                    meta:
                      pagination:
                        page: 1
                        page_size: 25
                        total_pages: 1
                        total_count: 1
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

    post:
      summary: Request promotion (internal use)
      description: |
        Create a promotion request (typically triggered by PATCH /members/{user_id}).

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 20 requests/minute (per user)

        **Behavior:**
        - Creates pending promotion request
        - Sends notification to target user
        - Checks for suspicious pattern (<24h org membership)
        - If suspicious: Also sends alert to org admins
        - Expires after 7 days (configurable)

        **Audit Event:** `project.membership.promotion_requested`
      operationId: requestPromotion
      tags:
        - Promotions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembershipPromotionCreate'
            examples:
              promote_to_admin:
                summary: Promote editor to admin
                value:
                  user_id: "u2345678-bcde-f123-4567-890abcdef123"
                  to_role: "admin"
      responses:
        '201':
          description: Promotion request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembershipPromotionRead'
              examples:
                created:
                  value:
                    data:
                      id: "pr123456-abcd-ef12-3456-7890abcdef12"
                      project:
                        id: "p1234567-abcd-ef12-3456-7890abcdef12"
                        name: "Premier League 2025/26"
                      target_user:
                        id: "u2345678-bcde-f123-4567-890abcdef123"
                        full_name: "Bob Smith"
                        email: "bob@example.com"
                      requested_by:
                        id: "u1234567-abcd-ef12-3456-7890abcdef12"
                        full_name: "Alice Johnson"
                      from_role: "editor"
                      to_role: "admin"
                      status: "pending"
                      is_suspicious: false
                      created_at: "2026-01-04T10:00:00Z"
                      expires_at: "2026-01-11T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserOrProjectNotFound'
        '409':
          description: Promotion already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    errors:
                      - code: "promotion_already_pending"
                        message: "A promotion request for this user is already pending."
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/promotions/{promotion_id}:
    get:
      summary: Get promotion details
      description: |
        Retrieve details of a specific promotion request.

        **Permission Required:** Project admin OR target user
        **Rate Limit:** 100 requests/minute (per user)
      operationId: getProjectPromotion
      tags:
        - Promotions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PromotionId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembershipPromotionRead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PromotionNotFound'

  /promotions/{promotion_id}/accept:
    post:
      summary: Accept promotion
      description: |
        Target user accepts their role promotion.

        **Permission Required:** Must be the target user (cannot accept others' promotions)
        **Rate Limit:** 20 requests/minute (per user)

        **Behavior:**
        - Updates ProjectMembership.role to new role
        - Sets promotion status to "accepted"
        - Sends notification to requester and project admins
        - Invalidates permission cache

        **Audit Events:** `project.membership.promotion_accepted`, `project.membership.role_changed`
      operationId: acceptPromotion
      tags:
        - Promotions
      parameters:
        - name: promotion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Promotion UUID
      responses:
        '200':
          description: Promotion accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      promotion_id:
                        type: string
                        format: uuid
                      new_role:
                        type: string
                        enum: [admin]
                      membership_id:
                        type: string
                        format: uuid
                        description: Updated membership ID
              examples:
                accepted:
                  value:
                    data:
                      promotion_id: "pr123456-abcd-ef12-3456-7890abcdef12"
                      new_role: "admin"
                      membership_id: "m1234567-abcd-ef12-3456-7890abcdef12"
        '403':
          description: Not the target user or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_target_user:
                  value:
                    errors:
                      - code: "not_promotion_target"
                        message: "Only the target user can accept this promotion."
        '404':
          $ref: '#/components/responses/PromotionNotFound'
        '409':
          description: Promotion already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_accepted:
                  value:
                    errors:
                      - code: "promotion_already_resolved"
                        message: "This promotion has already been accepted or declined."

  /promotions/{promotion_id}/decline:
    post:
      summary: Decline promotion
      description: |
        Target user declines their role promotion.

        **Permission Required:** Must be the target user
        **Rate Limit:** 20 requests/minute (per user)

        **Behavior (per clarification):**
        - Sets promotion status to "declined" (NOT "cancelled")
        - Keeps original role unchanged
        - Sends notification to requester
        - Does NOT require decline reason (optional field)

        **Audit Event:** `project.membership.promotion_declined`
      operationId: declinePromotion
      tags:
        - Promotions
      parameters:
        - name: promotion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Promotion UUID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Optional reason for declining
            examples:
              with_reason:
                summary: Decline with reason
                value:
                  reason: "Not ready for admin responsibilities yet."
              without_reason:
                summary: Decline without reason
                value: {}
      responses:
        '200':
          description: Promotion declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      promotion_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [declined]
              examples:
                declined:
                  value:
                    data:
                      promotion_id: "pr123456-abcd-ef12-3456-7890abcdef12"
                      status: "declined"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PromotionNotFound'
        '409':
          description: Promotion already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /promotions/{promotion_id}/cancel:
    delete:
      summary: Cancel promotion request
      description: |
        Cancel a pending promotion request (by requester or project admin).

        **Permission Required:** Original requester OR project admin
        **Rate Limit:** 30 requests/minute (per user)

        **Behavior:**
        - Sets promotion status to "cancelled"
        - Sends notification to target user
        - Does NOT revert any role changes (use this before acceptance only)

        **Audit Event:** `project.membership.promotion_cancelled`
      operationId: cancelPromotion
      tags:
        - Promotions
      parameters:
        - name: promotion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Promotion UUID
      responses:
        '204':
          description: Promotion cancelled successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PromotionNotFound'
        '422':
          description: Cannot cancel (already accepted/declined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_resolved:
                  value:
                    errors:
                      - code: "invalid_state_transition"
                        message: "Cannot cancel promotion that has already been resolved."

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID

    PromotionId:
      name: promotion_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Promotion UUID

  schemas:
    ProjectMembershipPromotionRead:
      type: object
      required:
        - id
        - project
        - target_user
        - requested_by
        - from_role
        - to_role
        - status
        - is_suspicious
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: Promotion UUID
        project:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        target_user:
          type: object
          required:
            - id
            - full_name
            - email
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            email:
              type: string
              format: email
        requested_by:
          type: object
          required:
            - id
            - full_name
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
        from_role:
          type: string
          enum: [viewer, editor]
          description: Original role before promotion
        to_role:
          type: string
          enum: [admin]
          description: Target role after promotion (always admin)
        status:
          type: string
          enum: [pending, accepted, declined, expired, cancelled]
          description: Current promotion status
        is_suspicious:
          type: boolean
          description: Whether promotion triggered suspicious activity alert
        suspicious_reason:
          type: string
          nullable: true
          description: Reason for suspicious flag (e.g., "User joined organization <24h ago")
        created_at:
          type: string
          format: date-time
          description: Promotion request timestamp
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp (7 days from creation)
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When promotion was accepted/declined (null if pending)

    ProjectMembershipPromotionCreate:
      type: object
      required:
        - user_id
        - to_role
      properties:
        user_id:
          type: string
          format: uuid
          description: User to promote
        to_role:
          type: string
          enum: [admin]
          description: Target role (currently only admin elevation requires approval)

    PaginationMeta:
      type: object
      required:
        - pagination
      properties:
        pagination:
          type: object
          required:
            - page
            - page_size
            - total_pages
            - total_count
          properties:
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              minimum: 1
            total_pages:
              type: integer
              minimum: 0
            total_count:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            no_permission:
              value:
                errors:
                  - code: "permission_denied"
                    message: "You do not have permission to manage promotions for this project."

    ProjectNotFound:
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UserOrProjectNotFound:
      description: User or project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PromotionNotFound:
      description: Promotion not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                errors:
                  - code: "promotion_not_found"
                    message: "Promotion request not found or has expired."

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_role:
              value:
                errors:
                  - code: "invalid_role_transition"
                    message: "User is already an admin. Cannot promote further."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid

security:
  - BearerAuth: []
  - SessionAuth: []
