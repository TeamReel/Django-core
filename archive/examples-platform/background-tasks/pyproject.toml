[project]
name = "background-tasks-example"
version = "0.1.0"
description = "Background tasks example demonstrating Celery patterns with Django Core-App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "celery>=5.3",
    "redis>=5.0",
    "django-celery-beat>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.5",
    "pytest-celery>=1.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/email_tasks"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
