repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(venv/|\.venv/|env/|\.worktrees/|\.git/|\.mypy_cache/|\.pytest_cache/|htmlcov/|\.kittify/venv/)'
      - id: end-of-file-fixer
        exclude: '^(venv/|\.venv/|env/|\.worktrees/|\.git/|\.mypy_cache/|\.pytest_cache/|htmlcov/|\.kittify/venv/)'
      - id: check-yaml
        files: '^(\.github/|\.kittify/|kitty-specs/|docs/|src/|tests/)'
        exclude: '^docs/deployment/.*\.yaml$'
        args: [--allow-multiple-documents]
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.12
        files: '^(src/|tests/|\.kittify/|kitty-specs/|docs/|manage\.py|pyproject\.toml)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        # Only enforce errors (E, F, W) - not style suggestions (B, S, N, I)
        # Rationale: B904 (exception chaining), S-codes (security suggestions),
        # N-codes (naming), I-codes (import order) are best practices, not blockers
        args: ["--fix", "--exit-non-zero-on-fix", "--select=E,F,W", "--ignore=E501"]
        files: '^(src/|tests/|\.kittify/|kitty-specs/)'
        exclude: '^(?:\.kittify/scripts/)'


  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        # Run mypy in CI only (documented decision)
        # Reason: Pre-commit isolated environment is fragile with Django dependencies
        # Contributors should run `mypy src/` locally
        stages: [manual]
        args: ["--config-file=pyproject.toml"]
        additional_dependencies: []
        files: '^(src/|tests/)'
        exclude: '.*'

  # Custom hook for validating integration guide examples
  - repo: local
    hooks:
      - id: validate-examples
        name: Validate integration guide examples
        description: Run TypeScript type-check, lint, and build on examples
        entry: ./scripts/validate-examples.ps1
        language: script
        stages: [commit]
        files: '^examples/integration-guides/.*\.(ts|tsx|json)$'
        pass_filenames: false
        verbose: true
        # Temporarily disabled - requires pwsh (PowerShell Core) which may not be installed
        exclude: '.*'
