# Nginx Configuration - Local Development
# B19 Deployment Templates & Configuration
#
# Purpose: Simple reverse proxy for local Docker Compose testing
# Usage: Used by docker-compose.local.yml (optional, can use port 8000 directly)

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Basic proxy to Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (if needed, though local dev typically uses runserver)
    location /static/ {
        alias /app/staticfiles/;
    }
}

# Note: This is optional for local development
# You can access Django directly at http://localhost:8000 without Nginx
