# Nginx Configuration - Production Environment
# B19 Deployment Templates & Configuration
#
# Purpose: HTTPS reverse proxy with full security headers for production
# Usage: Production deployment (cloud load balancer → Nginx → Django)

upstream django {
    server web:8000;

    # For multiple web replicas, add additional servers:
    # server web-2:8000;
    # server web-3:8000;

    keepalive 32;  # Keep connections alive for performance
}

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    server_name _;  # Replace with your production domain

    # ACME challenge for Let's Encrypt SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;  # Replace with your production domain

    # SSL/TLS configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL configuration (Mozilla Intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers (B03 alignment)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (B03 security baseline)
    # Adjust based on your application's needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Static files served by Nginx (B19 optimization)
    location /static/ {
        alias /app/staticfiles/;

        # Aggressive caching with immutable
        expires 1y;
        add_header Cache-Control "public, immutable";

        # CORS headers if needed for CDN
        # add_header Access-Control-Allow-Origin "*";

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
        gzip_min_length 1000;

        access_log off;
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/mediafiles/;

        # Medium-term caching
        expires 30d;
        add_header Cache-Control "public";

        access_log off;
    }

    # Proxy to Django application
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts (match Gunicorn timeout + buffer)
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffer settings for performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Keep-alive
        proxy_set_header Connection "";
    }

    # Health check endpoints (bypass cache, minimal logging)
    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Prometheus metrics endpoint (if exposed)
    location /metrics {
        proxy_pass http://django;
        proxy_set_header Host $host;

        # Restrict access to monitoring systems only
        # allow 10.0.0.0/8;  # Internal network
        # deny all;

        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to specific file types
    location ~* \.(env|git|gitignore|dockerignore|md|txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limiting (optional, configure in nginx.conf http block)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # limit_req zone=api_limit burst=20 nodelay;
}

# Production deployment notes:
# - Replace server_name with your actual domain
# - Obtain SSL certificates (Let's Encrypt recommended):
#   certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
# - Update ssl_certificate paths to match your certificate location
# - Configure DNS to point to your load balancer or Nginx instance
# - Consider using a CDN (CloudFlare, AWS CloudFront) for static files
# - Enable rate limiting in nginx.conf http block for API protection
# - Monitor Nginx access/error logs for security events
