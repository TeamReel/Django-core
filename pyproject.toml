[project]
name = "django-core"
version = "0.1.0"
description = "Product-agnostic Django skeleton following Core-App Constitution"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
constitution-engine = "constitution_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["constitution_engine*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = """
    -v
    --tb=short
    --strict-markers
    --reuse-db
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=json
    --no-cov-on-fail
    """
norecursedirs = ["tests/fixtures", "migrations", ".git", ".venv", "venv"]
markers = [
    "unit: Unit tests for isolated components",
    "integration: Integration tests for component interactions",
    "api: API endpoint tests",
    "slow: Tests that take a long time to run",
    "security: Security-related tests",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.mypy_cache
  | \.pytest_cache
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
     ".kittify/scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "S",   # bandit (security)
    "B",   # bugbear
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "S106",  # Allow hardcoded password arguments in tests
    "S311",  # Allow pseudo-random generators in tests
]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
packages = ["src"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "config.settings.*"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.local"
strict_settings = true

[tool.coverage.run]
source = ["src"]
# WP14-T132: Coverage exclusions for test files, migrations, and generated code
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "*/__init__.py",
    "*/__pycache__/*",
    "*/.*",
    "*/venv/*",
    "*/node_modules/*",
]
branch = true

[tool.coverage.report]
# WP14-T127: Coverage threshold set to 80% per SC-008 requirement
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"
