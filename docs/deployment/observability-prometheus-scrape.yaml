## Verifying Scrape Configuration

### Check Prometheus Targets

1. Open Prometheus UI: `http://prometheus:9090`
2. Navigate to **Status > Targets**
3. Find `django-core-app` job
4. Verify:
   - **State**: UP (green)
   - **Last Scrape**: <60 seconds ago
   - **Scrape Duration**: <1 second
   - **Error**: (empty)

### Test Metrics Endpoint

```bash
# From within cluster
kubectl run curl --rm -it --image=curlimages/curl -- \
  curl http://django-core-app.production.svc.cluster.local/metrics

# Expected output (sample):
# # HELP http_requests_total Total HTTP requests
# # TYPE http_requests_total counter
# http_requests_total{method="GET",status="2xx"} 1523
# http_requests_total{method="POST",status="2xx"} 342
# ...
```

### Query Metrics in Prometheus

```promql
# Check if metrics are being scraped
up{job="django-core-app"}

# Expected: 1 (UP) for each pod

# Query HTTP request rate
rate(http_requests_total[5m])

# Query task metrics
tasks_started_total
```

