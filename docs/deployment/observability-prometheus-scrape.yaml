## Direct Scrape (Non-Kubernetes)

For standalone deployments without Kubernetes service discovery:

```yaml
scrape_configs:
  - job_name: 'django-core-app'
    scrape_interval: 60s
    scrape_timeout: 10s
    
    static_configs:
      - targets:
          - 'django-app-1:8000'
          - 'django-app-2:8000'
          - 'django-app-3:8000'
        labels:
          environment: 'production'
          component: 'web'
    
    metrics_path: '/metrics'
    scheme: 'http'
```

