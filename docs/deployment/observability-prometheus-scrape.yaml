## ServiceMonitor (Prometheus Operator)

If using Prometheus Operator, use ServiceMonitor instead of relabel configs:

```yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: django-core-app
  namespace: production
  labels:
    app: django-core
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: django-core
      component: web
  
  endpoints:
  - port: http
    path: /metrics
    interval: 60s
    scrapeTimeout: 10s
    
    # Optional: TLS configuration
    # tlsConfig:
    #   insecureSkipVerify: true
    
    # Optional: Basic authentication
    # basicAuth:
    #   username:
    #     name: django-metrics-auth
    #     key: username
    #   password:
    #     name: django-metrics-auth
    #     key: password
```

