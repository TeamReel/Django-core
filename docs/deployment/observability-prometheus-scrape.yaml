## Alert Rules

Create `django-core-alerts.yml`:

```yaml
groups:
  - name: django_core_alerts
    interval: 60s
    rules:
      # High HTTP error rate
      - alert: DjangoCoreHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5xx"}[5m])) 
          / 
          sum(rate(http_requests_total[5m])) 
          > 0.05
        for: 5m
        labels:
          severity: warning
          component: web
        annotations:
          summary: "Django Core high HTTP 5xx error rate (>5%)"
          description: "{{ $value | humanizePercentage }} of requests are failing"
      
      # Slow HTTP requests
      - alert: DjangoCoreSlow HTTPRequests
        expr: |
          histogram_quantile(0.95, 
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          component: web
        annotations:
          summary: "Django Core 95th percentile HTTP latency >1s"
          description: "P95 latency: {{ $value | humanizeDuration }}"
      
      # Task failure rate
      - alert: DjangoCoreCeleryTaskFailures
        expr: |
          sum(rate(tasks_completed_total{status="failure"}[5m])) 
          / 
          sum(rate(tasks_completed_total[5m])) 
          > 0.10
        for: 5m
        labels:
          severity: critical
          component: celery
        annotations:
          summary: "Django Core Celery task failure rate >10%"
          description: "{{ $value | humanizePercentage }} of tasks are failing"
      
      # Metrics endpoint down
      - alert: DjangoCoreMet ricsEndpointDown
        expr: up{job="django-core-app"} == 0
        for: 2m
        labels:
          severity: critical
          component: observability
        annotations:
          summary: "Django Core metrics endpoint unreachable"
          description: "Prometheus cannot scrape /metrics for 2+ minutes"
```

Load alerts into Prometheus:

```yaml
# prometheus.yml
rule_files:
  - '/etc/prometheus/alerts/django-core-alerts.yml'
```

