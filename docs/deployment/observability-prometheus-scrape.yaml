## Scrape Interval Recommendations

| Environment | Scrape Interval | Rationale |
|-------------|----------------|-----------|
| **Production** | 60s | Standard interval; balances granularity vs storage |
| **Staging** | 30s | More frequent for testing alert rules |
| **Development** | 15s | Rapid feedback for debugging metrics |

**Storage impact**: 60s interval = 1,440 samples/day/metric. 15s interval = 5,760 samples/day/metric (4x storage).

