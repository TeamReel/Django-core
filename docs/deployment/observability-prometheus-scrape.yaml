## Troubleshooting

### Metrics endpoint returns 404

**Cause**: Django app not configured with `django-prometheus` URLs

**Solution**:
```python
# src/config/urls.py
urlpatterns = [
    # ...
    path('', include('django_prometheus.urls')),  # ← Add this
]
```

### Scrape timeout errors

**Symptoms**: Prometheus logs show `context deadline exceeded`

**Cause**: `/metrics` endpoint takes >10 seconds to respond

**Solution**:
- Check metric cardinality (too many unique label combinations)
- Increase `scrape_timeout` to 15s
- Optimize slow metric collectors

### Metrics not appearing in Prometheus

**Diagnosis checklist**:
1. ✓ Service has `prometheus.io/scrape: "true"` annotation
2. ✓ Prometheus can reach pod network (check network policies)
3. ✓ `/metrics` endpoint returns data (`curl http://pod-ip:8000/metrics`)
4. ✓ Prometheus scrape config has correct relabel rules
5. ✓ No authentication blocking scrape

