# Prometheus Scrape Configuration for Django Core

This example shows how to configure Prometheus to scrape metrics from Django Core application with Platform Observability Foundation.

---

## Kubernetes Service Discovery

### Service with Prometheus Annotations

```yaml
apiVersion: v1
kind: Service
metadata:
  name: django-core-app
  namespace: production
  labels:
    app: django-core
    component: web
  annotations:
    # Prometheus scrape annotations
    prometheus.io/scrape: "true"   # Enable scraping
    prometheus.io/port: "8000"     # Port to scrape
    prometheus.io/path: "/metrics" # Metrics endpoint path
spec:
  selector:
    app: django-core
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
```

### Prometheus Configuration (prometheus.yml)

```yaml
global:
  scrape_interval: 60s      # Scrape every 60 seconds (recommended)
  scrape_timeout: 10s       # Allow 10 seconds for scrape to complete
  evaluation_interval: 60s  # Evaluate rules every 60 seconds

scrape_configs:
  # Django Core application metrics
  - job_name: 'django-core-app'
    scrape_interval: 60s
    scrape_timeout: 10s
    
    # Kubernetes service discovery
    kubernetes_sd_configs:
      - role: service
        namespaces:
          names:
            - production
    
    # Relabeling rules to filter services with prometheus.io/scrape annotation
    relabel_configs:
      # Only scrape services with prometheus.io/scrape=true annotation
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Use prometheus.io/path annotation for metrics path
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      # Use prometheus.io/port annotation for scrape port
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      
      # Add service name as label
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service
      
      # Add namespace as label
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
```

