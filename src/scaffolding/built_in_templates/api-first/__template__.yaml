# API-First Django App Template
# Extends minimal template with Django REST Framework serializers, viewsets, and URL routing

name: api-first
description: |
  API-first Django app with Django REST Framework integration.
  Includes serializers, viewsets, URL configuration, and comprehensive
  API tests. Ideal for RESTful APIs and microservices.

extends: minimal  # Inherits all files from minimal template

variables:
  required:
    app_name:
      type: string
      description: "Name of the Django app (snake_case)"
      validation: "^[a-z][a-z0-9_]*$"
  optional:
    model_name:
      type: string
      description: "Name of the primary model (PascalCase)"
      default: "Item"
      validation: "^[A-Z][a-zA-Z0-9]*$"

files:
  # Inherited from minimal: __init__.py, apps.py, models.py, tests/__init__.py, tests/test_models.py, migrations/__init__.py, locale/.gitkeep

  # API-specific files
  - path: "serializers.py"
    template: "serializers.py.j2"
  - path: "views.py"
    template: "views.py.j2"
  - path: "urls.py"
    template: "urls.py.j2"
  - path: "permissions.py"
    template: "permissions.py.j2"
  - path: "filters.py"
    template: "filters.py.j2"
  - path: "tests/test_api.py"
    template: "tests/test_api.py.j2"
  - path: "tests/test_serializers.py"
    template: "tests/test_serializers.py.j2"
  - path: "tests/test_permissions.py"
    template: "tests/test_permissions.py.j2"

# Template metadata
author: "Django Core Team"
version: "1.0.0"
django_version: ">=5.1"
dependencies:
  - "djangorestframework>=3.14"
