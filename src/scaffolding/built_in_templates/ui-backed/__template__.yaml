# UI-Backed Django App Template
# Extends minimal template with Django views, forms, HTML templates, and static files

name: ui-backed
description: |
  Full-stack Django app with views, forms, HTML templates, and static files.
  Includes CRUD views, form handling, template inheritance, CSS styling,
  and comprehensive UI tests. Ideal for traditional Django web applications
  with server-side rendering.

extends: minimal  # Inherits all files from minimal template

variables:
  required:
    app_name:
      type: string
      description: "Name of the Django app (snake_case)"
      validation: "^[a-z][a-z0-9_]*$"
  optional:
    model_name:
      type: string
      description: "Name of the primary model (PascalCase)"
      default: "Item"
      validation: "^[A-Z][a-zA-Z0-9]*$"

files:
  # Inherited from minimal: __init__.py, apps.py, models.py, tests/__init__.py, tests/test_models.py, migrations/__init__.py, locale/.gitkeep

  # UI-specific files
  - path: "views.py"
    template: "views.py.j2"
  - path: "forms.py"
    template: "forms.py.j2"
  - path: "urls.py"
    template: "urls.py.j2"
  - path: "templates/{{ app_name }}/base.html"
    template: "templates/base.html.j2"
  - path: "templates/{{ app_name }}/{{ model_name | default('item') | lower }}_list.html"
    template: "templates/item_list.html.j2"
  - path: "templates/{{ app_name }}/{{ model_name | default('item') | lower }}_detail.html"
    template: "templates/item_detail.html.j2"
  - path: "templates/{{ app_name }}/{{ model_name | default('item') | lower }}_form.html"
    template: "templates/item_form.html.j2"
  - path: "templates/{{ app_name }}/{{ model_name | default('item') | lower }}_confirm_delete.html"
    template: "templates/item_confirm_delete.html.j2"
  - path: "static/{{ app_name }}/css/style.css"
    template: "static/style.css"
  - path: "static/{{ app_name }}/js/main.js"
    template: "static/main.js"
  - path: "tests/test_views.py"
    template: "tests/test_views.py.j2"
  - path: "tests/test_forms.py"
    template: "tests/test_forms.py.j2"

# Template metadata
author: "Django Core Team"
version: "1.0.0"
django_version: ">=5.1"
