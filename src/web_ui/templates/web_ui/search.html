{% extends "web_ui/base/layout.html" %}

{% block title %}Search Demo - {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="mb-4 text-center">Global Search</h1>

            <!-- Search Form -->
            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <form id="searchForm" class="d-flex gap-2">
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search for clubs, players, etc..." required>
                        <button type="submit" class="btn btn-primary btn-lg">Search</button>
                    </form>
                </div>
            </div>

            <!-- Results Container -->
            <div id="resultsContainer">
                <div class="text-center text-muted">
                    <p>Enter a query to start searching.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('searchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const query = document.getElementById('searchInput').value;
    const container = document.getElementById('resultsContainer');

    container.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>';

    try {
        const response = await fetch(`/api/v1/search/?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        container.innerHTML = '';

        if (Object.keys(data).length === 0 || (data.results && data.results.length === 0)) {
            container.innerHTML = '<div class="alert alert-info text-center">No results found.</div>';
            return;
        }

        // Handle grouped results (global search)
        if (data.results) {
            // Paginated results (filtered search)
            const section = document.createElement('div');
            section.className = 'mb-4';
            section.innerHTML = `<h3 class="h5 text-uppercase text-muted border-bottom pb-2 mb-3">Search Results</h3>`;

            const list = document.createElement('div');
            list.className = 'list-group';

            data.results.forEach(item => {
                const link = document.createElement('a');
                link.href = item.url || '#';
                link.className = 'list-group-item list-group-item-action';
                link.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${item.title}</h5>
                        <small class="text-muted">${item.content_type || ''}</small>
                    </div>
                    <p class="mb-1">${item.description || ''}</p>
                    ${item.highlight ? `<small class="text-muted">...${item.highlight}...</small>` : ''}
                `;
                list.appendChild(link);
            });

            section.appendChild(list);
            container.appendChild(section);
        } else {
            // Grouped results (global search)
            const categoryLabels = {
                'users': 'Users',
                'projects': 'Projects',
                'organisations': 'Organisations'
            };

            for (const [category, items] of Object.entries(data)) {
                if (!items || items.length === 0) continue;

                const section = document.createElement('div');
                section.className = 'mb-4';
                const categoryLabel = categoryLabels[category] || category;
                section.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h3 class="h5 text-uppercase text-muted mb-0">${categoryLabel}</h3>
                        <a href="/ui/search/?q=${encodeURIComponent(query)}&types=${category}" class="btn btn-sm btn-outline-primary">View All</a>
                    </div>
                `;

                const list = document.createElement('div');
                list.className = 'list-group';

                items.forEach(item => {
                    const link = document.createElement('a');
                    link.href = item.url || '#';
                    link.className = 'list-group-item list-group-item-action';
                    link.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${item.title}</h5>
                            <small class="text-muted">${item.content_type || ''}</small>
                        </div>
                        <p class="mb-1">${item.description || ''}</p>
                        ${item.highlight ? `<small class="text-muted">...${item.highlight}...</small>` : ''}
                    `;
                    list.appendChild(link);
                });

                section.appendChild(list);
                container.appendChild(section);
            }
        }

    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="alert alert-danger">An error occurred while searching.</div>';
    }
});
</script>
{% endblock %}
