{% extends "web_ui/base/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="ui-container" style="padding: 20px;">
    <h1>{{ title }}</h1>

    <div class="ui-card" style="border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px;">
        <div class="ui-card__header">
            <h2>Connection Status: <span id="status-indicator" style="color: gray;">Disconnected</span></h2>
        </div>
        <div class="ui-card__body">
            <div class="ui-controls" style="margin-bottom: 20px;">
                <button id="btn-connect" class="ui-btn" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Connect</button>
                <button id="btn-disconnect" class="ui-btn" style="padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;" disabled>Disconnect</button>
                <button id="btn-ping" class="ui-btn" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;" disabled>Send Ping</button>
                <button id="btn-burst" class="ui-btn" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;" disabled>Send Burst (Trigger Limit)</button>
            </div>

            <div class="ui-log" style="background: #f5f5f5; padding: 10px; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; border: 1px solid #ccc;">
                <div id="log-content"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let socket = null;
    const statusIndicator = document.getElementById('status-indicator');
    const btnConnect = document.getElementById('btn-connect');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const btnPing = document.getElementById('btn-ping');
    const btnBurst = document.getElementById('btn-burst');
    const logContent = document.getElementById('log-content');

    function log(message, type = 'info') {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        div.style.color = type === 'error' ? 'red' : (type === 'success' ? 'green' : 'black');
        logContent.appendChild(div);
        logContent.scrollTop = logContent.scrollHeight;
    }

    function updateStatus(status, color) {
        statusIndicator.textContent = status;
        statusIndicator.style.color = color;

        const connected = status === 'Connected';
        btnConnect.disabled = connected;
        btnDisconnect.disabled = !connected;
        btnPing.disabled = !connected;
        btnBurst.disabled = !connected;

        // Update button styles for disabled state
        [btnConnect, btnDisconnect, btnPing, btnBurst].forEach(btn => {
            if (btn.disabled) {
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            } else {
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        });
    }

    btnConnect.addEventListener('click', () => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/notifications/`;

        log(`Connecting to ${wsUrl}...`);
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            log('Connected!', 'success');
            updateStatus('Connected', 'green');
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'error') {
                log(`Error: ${data.message} (Code: ${data.code})`, 'error');
            } else {
                log(`Received: ${JSON.stringify(data)}`, 'info');
            }
        };

        socket.onclose = (event) => {
            log(`Disconnected (Code: ${event.code})`, 'info');
            updateStatus('Disconnected', 'gray');
            socket = null;
        };

        socket.onerror = (error) => {
            log('WebSocket Error', 'error');
        };
    });

    btnDisconnect.addEventListener('click', () => {
        if (socket) {
            socket.close();
        }
    });

    btnPing.addEventListener('click', () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'ping' }));
            log('Sent: ping');
        }
    });

    btnBurst.addEventListener('click', () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            log('Sending burst of 10 messages...');
            for (let i = 0; i < 10; i++) {
                socket.send(JSON.stringify({ type: 'ping', seq: i }));
            }
        }
    });

    // Initial state
    updateStatus('Disconnected', 'gray');
</script>
{% endblock %}
