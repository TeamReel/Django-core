{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Django Core</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .messages { padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .messages.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .messages.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .messages.info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Sign In</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="messages {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <p>Login functionality will be implemented in WP05.</p>
    <p><a href="{% url 'register' %}">Create an account</a></p>
</body>
</html>
