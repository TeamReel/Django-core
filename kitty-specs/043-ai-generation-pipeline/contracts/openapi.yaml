openapi: 3.0.3
info:
  title: B34 Generative Pipelines API
  version: 1.0.0
  description: AI content generation factory with template-based job lifecycle management

servers:
  - url: /api/v1/generative

tags:
  - name: Templates
  - name: Requests
  - name: Outputs

paths:
  /templates/:
    get:
      summary: List Generation Templates
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/ProjectIdFilter'
        - name: all_versions
          in: query
          required: false
          description: Include all versions
          schema:
            type: boolean
            default: false
        - name: is_active
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          $ref: '#/components/responses/TemplateListing'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create Template
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationTemplateCreate'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'

  /templates/{id}/:
    get:
      summary: Retrieve Template
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update Template
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationTemplateUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTemplate'

    delete:
      summary: Deactivate Template
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Deactivated

  /templates/{id}/clone/:
    post:
      summary: Clone Template (Create New Version)
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [template_data]
              properties:
                name:
                  type: string
                changes:
                  type: string
                template_data:
                  type: object
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTemplate'

  /requests/:
    get:
      summary: List Requests
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/ProjectIdFilter'
        - name: template_id
          in: query
          description: Filter by template
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, processing, completed, failed, cancelled]
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          $ref: '#/components/responses/RequestListing'

    post:
      summary: Submit Request
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequestCreate'
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'

  /requests/{id}/:
    get:
      summary: Get Request Status
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRequest'

  /requests/{id}/cancel/:
    post:
      summary: Cancel Request
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRequest'

  /outputs/{id}/:
    get:
      summary: Retrieve Output
      tags: [Outputs]
      parameters:
        - $ref: '#/components/parameters/OutputId'
      responses:
        '200':
          description: Output details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationOutput'

components:
  parameters:
    ProjectIdFilter:
      name: project_id
      in: query
      required: false
      description: Filter by project UUID
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      required: false
      description: Page number
      schema:
        type: integer
        default: 1

    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OutputId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    GenerationTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        pipeline_provider:
          type: string
          enum: [openai, langgraph]
        graph_id:
          type: string
          nullable: true
        template_data:
          type: object
        input_schema:
          type: object
        estimated_cost_credits:
          type: number
        retry_policy:
          type: object
        retention_days:
          type: integer
          nullable: true
        is_active:
          type: boolean
        is_latest:
          type: boolean
        version_number:
          type: integer
        parent_template:
          type: string
          format: uuid
          nullable: true
        project:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GenerationTemplateCreate:
      type: object
      required:
        - name
        - pipeline_provider
        - template_data
        - input_schema
        - project
      properties:
        name:
          type: string
        description:
          type: string
        pipeline_provider:
          type: string
          enum: [openai, langgraph]
        graph_id:
          type: string
        template_data:
          type: object
        input_schema:
          type: object
        estimated_cost_credits:
          type: number
          default: 0
        retry_policy:
          type: object
        retention_days:
          type: integer
          nullable: true
        project:
          type: string
          format: uuid

    GenerationTemplateUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        estimated_cost_credits:
          type: number
        retry_policy:
          type: object
        retention_days:
          type: integer
        is_active:
          type: boolean

    GenerationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        template:
          type: string
          format: uuid
        input_data:
          type: object
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        error_message:
          type: string
          nullable: true
        error_category:
          type: string
          nullable: true
        retry_count:
          type: integer
        max_retries_reached:
          type: boolean
        processing_metadata:
          type: object
          nullable: true
        actual_cost_credits:
          type: number
          nullable: true
        output:
          type: string
          format: uuid
          nullable: true
        project:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        websocket_channel:
          type: string

    GenerationRequestCreate:
      type: object
      required:
        - template
        - input_data
        - project
      properties:
        template:
          type: string
          format: uuid
        input_data:
          type: object
        project:
          type: string
          format: uuid

    GenerationOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        request:
          type: string
          format: uuid
        result_type:
          type: string
          enum: [text, json, file]
        result_data:
          type: object
          nullable: true
        file_ids:
          type: array
          items:
            type: string
            format: uuid
        file_urls:
          type: array
          items:
            type: object
        output_metadata:
          type: object
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          nullable: true
        error_code:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    TemplateListing:
      description: Template list
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                nullable: true
              previous:
                type: string
                nullable: true
              results:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationTemplate'

    RequestListing:
      description: Request list
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                nullable: true
              previous:
                type: string
                nullable: true
              results:
                type: array
                items:
                  $ref: '#/components/schemas/GenerationRequest'

    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid

    TokenAuth:
      type: http
      scheme: bearer

security:
  - SessionAuth: []
  - TokenAuth: []
