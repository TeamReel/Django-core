openapi: 3.0.3
info:
  title: Sport Configuration API
  description: API for managing sports, configurations, and outfit settings
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Sports
    description: Sport master data
  - name: Sport Configurations
    description: Sport-specific rules and settings
  - name: Outfit Configurations
    description: Project outfit settings
  - name: Validation
    description: Lineup and outfit validation

paths:
  /sports/:
    get:
      tags: [Sports]
      summary: List all sports
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of sports
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sport'
    post:
      tags: [Sports]
      summary: Create a sport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportCreate'
      responses:
        '201':
          description: Sport created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sport'

  /sports/{slug}/:
    get:
      tags: [Sports]
      summary: Get sport by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sport details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportWithConfig'
    patch:
      tags: [Sports]
      summary: Update sport
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportUpdate'
      responses:
        '200':
          description: Sport updated
    delete:
      tags: [Sports]
      summary: Delete sport
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Sport deleted

  /sports/{slug}/configuration/:
    get:
      tags: [Sport Configurations]
      summary: Get sport configuration
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sport configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportConfiguration'
    put:
      tags: [Sport Configurations]
      summary: Update sport configuration
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportConfigurationUpdate'
      responses:
        '200':
          description: Configuration updated

  /projects/{project_id}/outfits/:
    get:
      tags: [Outfit Configurations]
      summary: List outfit configurations for project
      description: Returns outfit configs for the project, with fallback to parent club
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_inherited
          in: query
          description: Include outfits inherited from parent club
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of outfit configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutfitConfigurationWithSource'
    post:
      tags: [Outfit Configurations]
      summary: Create outfit configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitConfigurationCreate'
      responses:
        '201':
          description: Outfit configuration created

  /projects/{project_id}/outfits/{outfit_type}/:
    get:
      tags: [Outfit Configurations]
      summary: Get specific outfit configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: outfit_type
          in: path
          required: true
          schema:
            type: string
            enum: [home, away, goalkeeper, trainer, third_kit]
      responses:
        '200':
          description: Outfit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitConfigurationWithSource'
    put:
      tags: [Outfit Configurations]
      summary: Update outfit configuration
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: outfit_type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitConfigurationUpdate'
      responses:
        '200':
          description: Outfit updated
    delete:
      tags: [Outfit Configurations]
      summary: Delete outfit configuration (reverts to inherited)
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: outfit_type
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Outfit deleted

  /validation/lineup/:
    post:
      tags: [Validation]
      summary: Validate lineup against sport rules
      description: Returns validation result with errors and warnings (non-blocking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineupValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /validation/outfit-contrast/:
    post:
      tags: [Validation]
      summary: Validate outfit color contrast
      description: Check goalkeeper outfit differs from field player outfits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitContrastRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

components:
  schemas:
    Sport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Football (11v11)"
        slug:
          type: string
          example: "football_11v11"
        federation_metadata:
          type: object
          example:
            code: "KNVB"
            country: "NL"
        sport_icon:
          type: string
          example: "⚽"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SportWithConfig:
      allOf:
        - $ref: '#/components/schemas/Sport'
        - type: object
          properties:
            configuration:
              $ref: '#/components/schemas/SportConfiguration'

    SportCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        federation_metadata:
          type: object
        sport_icon:
          type: string
        is_active:
          type: boolean
          default: true

    SportUpdate:
      type: object
      properties:
        name:
          type: string
        federation_metadata:
          type: object
        sport_icon:
          type: string
        is_active:
          type: boolean

    SportConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sport_id:
          type: string
          format: uuid
        team_size_min:
          type: integer
          example: 11
        team_size_max:
          type: integer
          example: 11
        max_substitutes:
          type: integer
          example: 7
        positions:
          type: array
          items:
            type: string
          example: ["GK", "LB", "CB", "RB", "CM", "ST"]
        formations:
          type: object
          example:
            "4-3-3":
              positions: ["GK", "LB", "CB", "CB", "RB", "CM", "CM", "CM", "LW", "ST", "RW"]
        outfit_types:
          type: array
          items:
            type: string
          example: ["home", "away", "goalkeeper", "trainer"]
        has_goalkeeper:
          type: boolean
        metadata:
          type: object

    SportConfigurationUpdate:
      type: object
      properties:
        team_size_min:
          type: integer
        team_size_max:
          type: integer
        max_substitutes:
          type: integer
        positions:
          type: array
          items:
            type: string
        formations:
          type: object
        outfit_types:
          type: array
          items:
            type: string
        has_goalkeeper:
          type: boolean
        metadata:
          type: object

    OutfitConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        outfit_type:
          type: string
          enum: [home, away, goalkeeper, trainer, third_kit]
        colors:
          type: object
          example:
            primary: "#FF0000"
            secondary: "#FFFFFF"
            accent: "#000000"
        sponsor_config:
          type: object
          example:
            chest: "Main Sponsor"
            sleeve: "Sleeve Sponsor"
        number_font:
          type: object
          example:
            family: "Arial"
            color: "#FFFFFF"
            outline: "#000000"
        badge_position:
          type: string
          example: "left_chest"
        metadata:
          type: object
        is_active:
          type: boolean

    OutfitConfigurationWithSource:
      allOf:
        - $ref: '#/components/schemas/OutfitConfiguration'
        - type: object
          properties:
            source:
              type: string
              enum: [own, inherited]
              description: Whether this outfit is defined on this project or inherited from parent
            source_project_id:
              type: string
              format: uuid
              description: Project ID where outfit is actually defined

    OutfitConfigurationCreate:
      type: object
      required: [outfit_type]
      properties:
        outfit_type:
          type: string
          enum: [home, away, goalkeeper, trainer, third_kit]
        colors:
          type: object
        sponsor_config:
          type: object
        number_font:
          type: object
        badge_position:
          type: string
        metadata:
          type: object
        is_active:
          type: boolean
          default: true

    OutfitConfigurationUpdate:
      type: object
      properties:
        colors:
          type: object
        sponsor_config:
          type: object
        number_font:
          type: object
        badge_position:
          type: string
        metadata:
          type: object
        is_active:
          type: boolean

    LineupValidationRequest:
      type: object
      required: [sport_slug, lineup]
      properties:
        sport_slug:
          type: string
          example: "football_11v11"
        lineup:
          type: array
          items:
            type: object
            properties:
              player_id:
                type: string
                format: uuid
              position:
                type: string
                example: "CM"
              is_starter:
                type: boolean
                default: true

    OutfitContrastRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
          format: uuid

    ValidationResult:
      type: object
      properties:
        is_valid:
          type: boolean
          description: True if no errors (warnings don't affect validity)
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      properties:
        field:
          type: string
          example: "lineup[0].position"
        message:
          type: string
          example: "'CDM' is not a standard position for Football (11v11)"
        level:
          type: string
          enum: [error, warning]
