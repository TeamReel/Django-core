openapi: 3.0.3
info:
  title: B35 Smart Asset Library API
  description: Digital Asset Management API for rich metadata, tagging, and context relations
  version: 1.0.0

servers:
  - url: /api/v1/media
    description: Media API endpoints

paths:
  /items/:
    get:
      summary: List media items
      description: List all media items with filtering and search
      operationId: listMediaItems
      tags: [MediaItems]
      parameters:
        - name: project
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by project ID
        - name: activity
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by activity ID
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag slugs
        - name: state
          in: query
          schema:
            type: string
            enum: [raw, processing, processed, error, archived]
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search on title/description
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of media items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemList'

    post:
      summary: Create media item
      description: Create a new media item wrapping an existing FileAsset
      operationId: createMediaItem
      tags: [MediaItems]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItemCreate'
      responses:
        '201':
          description: Media item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Validation error
        '404':
          description: FileAsset not found

  /items/{id}/:
    get:
      summary: Get media item
      operationId: getMediaItem
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemDetail'
        '404':
          description: Not found

    patch:
      summary: Update media item
      operationId: updateMediaItem
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItemUpdate'
      responses:
        '200':
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'

    delete:
      summary: Delete media item
      operationId: deleteMediaItem
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /items/{id}/tags/:
    post:
      summary: Add tags to media item
      operationId: addMediaItemTags
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Tag slugs to add
      responses:
        '200':
          description: Tags added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'

    delete:
      summary: Remove tags from media item
      operationId: removeMediaItemTags
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Tags removed

  /items/{id}/relations/:
    get:
      summary: List relations for media item
      operationId: listMediaItemRelations
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of relations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItemRelation'

    post:
      summary: Add relation to media item
      operationId: addMediaItemRelation
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaItemRelationCreate'
      responses:
        '201':
          description: Relation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemRelation'

  /items/{id}/thumbnails/:
    get:
      summary: Get thumbnails for media item
      operationId: getMediaItemThumbnails
      tags: [MediaItems]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thumbnail URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  thumbnails:
                    type: array
                    items:
                      type: object
                      properties:
                        size:
                          type: string
                          example: "200x200"
                        url:
                          type: string
                          format: uri
                        expires_at:
                          type: string
                          format: date-time

  /tags/:
    get:
      summary: List tags
      description: List available tags (system + project-specific)
      operationId: listTags
      tags: [Tags]
      parameters:
        - name: project
          in: query
          schema:
            type: string
            format: uuid
          description: Include project-specific tags
        - name: type
          in: query
          schema:
            type: string
            enum: [system, auto, manual]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTag'

    post:
      summary: Create tag
      operationId: createTag
      tags: [Tags]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaTagCreate'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTag'

  /collections/:
    get:
      summary: List collections
      operationId: listCollections
      tags: [Collections]
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'

    post:
      summary: Create collection
      operationId: createCollection
      tags: [Collections]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'

  /collections/{id}/:
    get:
      summary: Get collection with items
      operationId: getCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Collection with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'

    patch:
      summary: Update collection
      operationId: updateCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: Updated collection

    delete:
      summary: Delete collection
      operationId: deleteCollection
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /collections/{id}/items/:
    post:
      summary: Add items to collection
      operationId: addCollectionItems
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Items added

    delete:
      summary: Remove items from collection
      operationId: removeCollectionItems
      tags: [Collections]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Items removed

components:
  schemas:
    MediaItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        duration:
          type: number
          nullable: true
        state:
          type: string
          enum: [raw, processing, processed, error, archived]
        mime_type:
          type: string
        project_id:
          type: string
          format: uuid
          nullable: true
        activity_id:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/MediaTag'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MediaItemDetail:
      allOf:
        - $ref: '#/components/schemas/MediaItem'
        - type: object
          properties:
            file_url:
              type: string
              format: uri
              description: Presigned URL for file access
            thumbnails:
              type: array
              items:
                type: object
                properties:
                  size:
                    type: string
                  url:
                    type: string
                    format: uri
            relations:
              type: array
              items:
                $ref: '#/components/schemas/MediaItemRelation'
            collections:
              type: array
              items:
                $ref: '#/components/schemas/CollectionSummary'

    MediaItemList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'

    MediaItemCreate:
      type: object
      required: [file_id, title]
      properties:
        file_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        project_id:
          type: string
          format: uuid
        activity_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
          description: Tag slugs

    MediaItemUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [archived]
        activity_id:
          type: string
          format: uuid

    MediaTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tag_type:
          type: string
          enum: [system, auto, manual]
        project_id:
          type: string
          format: uuid
          nullable: true

    MediaTagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        project_id:
          type: string
          format: uuid
          description: Omit for global tag (requires admin)

    MediaItemRelation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content_type:
          type: string
          description: Model name (e.g., "organisationmembership")
        object_id:
          type: string
          format: uuid
        relation_type:
          type: string
          enum: [features, belongs_to, related_to, sponsored_by]
        object_display:
          type: string
          description: Human-readable representation
        created_at:
          type: string
          format: date-time

    MediaItemRelationCreate:
      type: object
      required: [content_type, object_id, relation_type]
      properties:
        content_type:
          type: string
          description: Model name
        object_id:
          type: string
          format: uuid
        relation_type:
          type: string
          enum: [features, belongs_to, related_to, sponsored_by]

    Collection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        project_id:
          type: string
          format: uuid
        item_count:
          type: integer
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaItem'

    CollectionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CollectionCreate:
      type: object
      required: [name, project_id]
      properties:
        name:
          type: string
        description:
          type: string
        project_id:
          type: string
          format: uuid

    CollectionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
