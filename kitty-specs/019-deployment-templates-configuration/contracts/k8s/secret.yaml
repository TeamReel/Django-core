# Kubernetes Secret Template - Sensitive Credentials
# B19 Deployment Templates & Configuration
#
# Purpose: Store sensitive application credentials
# Usage:
#   1. Replace placeholders with base64-encoded values
#   2. kubectl apply -f secret.yaml
#   3. NEVER commit this file with real values!
#
# Encoding values:
#   echo -n "your-value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: django-core-secrets
  namespace: default
  labels:
    app: django-core
    component: secrets
type: Opaque
data:
  # Django secret key (base64-encoded)
  # Generate: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
  # Then: echo -n "generated-key" | base64
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWhlcmUtNTAtcGx1cy1jaGFyYWN0ZXJz

  # PostgreSQL connection URL (base64-encoded)
  # Format: postgresql://user:password@host:port/database
  # Example: postgresql://dbuser:dbpass@postgres-service:5432/django_core
  DATABASE_URL: cG9zdGdyZXNxbDovL2RidXNlcjpkYnBhc3NAcG9zdGdyZXMtc2VydmljZTo1NDMyL2RqYW5nb19jb3Jl

  # Redis connection URL (base64-encoded)
  # Format: redis://[:password@]host:port/db
  # Example: redis://:redispass@redis-service:6379/0
  REDIS_URL: cmVkaXM6Ly86cmVkaXNwYXNzQHJlZGlzLXNlcnZpY2U6NjM3OS8w

  # Celery broker URL (typically same as REDIS_URL)
  CELERY_BROKER_URL: cmVkaXM6Ly86cmVkaXNwYXNzQHJlZGlzLXNlcnZpY2U6NjM3OS8w

  # Optional: Sentry DSN for error tracking (base64-encoded)
  # SENTRY_DSN: aHR0cHM6Ly9leGFtcGxlQHNlbnRyeS5pby8xMjM0NTY=

---
# SECURITY WARNING:
# - This file contains PLACEHOLDER values only
# - Replace all values with your actual base64-encoded credentials
# - NEVER commit this file with real secrets to version control
# - Use Kubernetes secret management solutions in production:
#   * AWS Secrets Manager + External Secrets Operator
#   * GCP Secret Manager + External Secrets Operator
#   * Azure Key Vault + Secrets Store CSI Driver
#   * HashiCorp Vault
#   * Sealed Secrets (bitnami-labs/sealed-secrets)
#
# Alternative: Create secret via kubectl (safer, not committed):
#   kubectl create secret generic django-core-secrets \
#     --from-literal=SECRET_KEY="your-secret-key" \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=REDIS_URL="redis://..." \
#     --from-literal=CELERY_BROKER_URL="redis://..."
