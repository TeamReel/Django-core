openapi: 3.1.0
info:
  title: Project Membership API
  version: 1.0.0
  description: |
    API endpoints for managing explicit project memberships in Django Core-App.
    Part of B26 Project-Level Access Control feature.

    **Key Capabilities:**
    - Add/remove project members with role assignment
    - List project members with pagination and filtering
    - Update member roles (with promotion approval for admin elevation)
    - Bulk member operations

    **Integrations:**
    - B08 Hierarchical Access Control (permission checks)
    - B09 Audit Logging (all membership changes)
    - B10 Feature Flags (extensibility points)
    - B16 Notifications (membership change alerts)

    **Permission Model:**
    - Hybrid resolution: Explicit membership OR organization-based implicit access
    - Private projects enforce explicit membership only
    - Roles: viewer (read-only), editor (read-write), admin (full control)

servers:
  - url: https://api.core-app.railway.app/api/v1
    description: Production (Railway)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Members
    description: Project member management
  - name: Roles
    description: Role management and updates
  - name: Permissions
    description: Permission resolution and checks

paths:
  /projects/{project_id}/members:
    get:
      summary: List project members
      description: |
        Retrieve all members with explicit membership to a project.
        **Does NOT include** users with implicit org-based access unless they have explicit membership.

        **Permission Required:** `projects.view_members` (viewer+)
        **Rate Limit:** 100 requests/minute (per user)
      operationId: listProjectMembers
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [viewer, editor, admin]
          description: Filter by role
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 2
          description: Search by name or email (min 2 characters)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Results per page (max 100)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMembershipRead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                success:
                  value:
                    data:
                      - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        user:
                          id: "u1234567-abcd-ef12-3456-7890abcdef12"
                          email: "alice@example.com"
                          full_name: "Alice Johnson"
                        role: "admin"
                        assignment_reason: "manual"
                        created_at: "2026-01-01T12:00:00Z"
                        updated_at: "2026-01-01T12:00:00Z"
                      - id: "b2c3d4e5-f678-90ab-cdef-123456789012"
                        user:
                          id: "u2345678-bcde-f123-4567-890abcdef123"
                          email: "bob@example.com"
                          full_name: "Bob Smith"
                        role: "editor"
                        assignment_reason: "invitation"
                        created_at: "2026-01-02T09:30:00Z"
                        updated_at: "2026-01-02T09:30:00Z"
                    meta:
                      pagination:
                        page: 1
                        page_size: 25
                        total_pages: 1
                        total_count: 2
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

    post:
      summary: Add project member
      description: |
        Add a user to a project with a specific role.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 30 requests/minute (per user)

        **Behavior:**
        - If user already has membership: 409 Conflict (use PATCH to update role)
        - If user is external (not in org): Feature flag `project_access_control.require_invitation` determines if invitation required
        - Assignment reason automatically set based on context

        **Audit Event:** `project.membership.created`
      operationId: addProjectMember
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembershipCreate'
            examples:
              add_editor:
                summary: Add editor role
                value:
                  user_id: "u3456789-cdef-1234-5678-90abcdef1234"
                  role: "editor"
              add_admin:
                summary: Add admin role (may trigger promotion approval)
                value:
                  user_id: "u4567890-def1-2345-6789-0abcdef12345"
                  role: "admin"
      responses:
        '201':
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembershipRead'
              examples:
                success:
                  value:
                    data:
                      id: "c3d4e5f6-7890-abcd-ef12-34567890abcd"
                      user:
                        id: "u3456789-cdef-1234-5678-90abcdef1234"
                        email: "charlie@example.com"
                        full_name: "Charlie Davis"
                      role: "editor"
                      assignment_reason: "manual"
                      created_at: "2026-01-04T10:15:00Z"
                      updated_at: "2026-01-04T10:15:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserOrProjectNotFound'
        '409':
          $ref: '#/components/responses/MembershipAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/members/{user_id}:
    get:
      summary: Get specific member
      description: |
        Retrieve a specific project membership.

        **Permission Required:** `projects.view_members` (viewer+)
        **Rate Limit:** 100 requests/minute (per user)
      operationId: getProjectMember
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembershipRead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MembershipNotFound'

    patch:
      summary: Update member role
      description: |
        Update a project member's role.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 30 requests/minute (per user)

        **Special Behavior:**
        - Promoting to admin may require acceptance if feature flag `project_access_control.require_promotion_approval` is enabled AND target user's current org role is below threshold
        - If approval required: Returns 202 Accepted with pending promotion details
        - Demoting last admin: Returns 422 Validation Error (auto-assign to requester per FR-052)
        - Cannot change own role (prevents accidental lockout)

        **Audit Event:** `project.membership.role_changed` OR `project.membership.promotion_requested`
      operationId: updateProjectMemberRole
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembershipUpdate'
            examples:
              promote_to_admin:
                summary: Promote to admin (may require approval)
                value:
                  role: "admin"
              demote_to_editor:
                summary: Demote to editor
                value:
                  role: "editor"
      responses:
        '200':
          description: Role updated successfully (immediate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectMembershipRead'
        '202':
          description: Promotion request created (requires approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      promotion_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [pending]
                      message:
                        type: string
                        example: "Promotion to admin requires acceptance by the target user."
              examples:
                promotion_pending:
                  value:
                    data:
                      promotion_id: "d4e5f678-90ab-cdef-1234-567890abcdef"
                      status: "pending"
                      message: "Promotion to admin requires acceptance by the target user."
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MembershipNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Remove member
      description: |
        Remove a user's explicit project membership.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 30 requests/minute (per user)

        **Behavior:**
        - Soft delete (sets deleted_at timestamp)
        - Cannot remove last admin (returns 422 Validation Error)
        - User may still have implicit org-based access after removal (unless private project)
        - Cache invalidation triggered automatically

        **Audit Event:** `project.membership.deleted`
      operationId: removeProjectMember
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Member removed successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MembershipNotFound'
        '422':
          description: Cannot remove last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                last_admin:
                  value:
                    errors:
                      - code: "last_admin_protection"
                        message: "Cannot remove the last admin from the project."
                        field: "user_id"

  /projects/{project_id}/members/bulk:
    post:
      summary: Bulk add members
      description: |
        Add multiple users to a project in a single request.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 10 requests/minute (per user)

        **Behavior:**
        - Partial success allowed: Successfully added members returned, failures in errors array
        - All operations audited individually
        - Transaction boundary per member (failure of one doesn't roll back others)

        **Audit Event:** `project.membership.created` (per member)
      operationId: bulkAddProjectMembers
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - members
              properties:
                members:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/ProjectMembershipCreate'
            examples:
              bulk_add:
                summary: Add 3 members
                value:
                  members:
                    - user_id: "u5678901-ef12-3456-7890-abcdef123456"
                      role: "viewer"
                    - user_id: "u6789012-f123-4567-890a-bcdef1234567"
                      role: "editor"
                    - user_id: "u7890123-1234-5678-90ab-cdef12345678"
                      role: "editor"
      responses:
        '201':
          description: Bulk operation completed (check errors for failures)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMembershipRead'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                          format: uuid
                        code:
                          type: string
                        message:
                          type: string
              examples:
                partial_success:
                  value:
                    data:
                      - id: "e5f67890-abcd-ef12-3456-7890abcdef12"
                        user:
                          id: "u5678901-ef12-3456-7890-abcdef123456"
                          email: "dave@example.com"
                          full_name: "Dave Wilson"
                        role: "viewer"
                        assignment_reason: "manual"
                        created_at: "2026-01-04T11:00:00Z"
                        updated_at: "2026-01-04T11:00:00Z"
                      - id: "f6789012-bcde-f123-4567-890abcdef123"
                        user:
                          id: "u6789012-f123-4567-890a-bcdef1234567"
                          email: "eve@example.com"
                          full_name: "Eve Martinez"
                        role: "editor"
                        assignment_reason: "manual"
                        created_at: "2026-01-04T11:00:01Z"
                        updated_at: "2026-01-04T11:00:01Z"
                    errors:
                      - user_id: "u7890123-1234-5678-90ab-cdef12345678"
                        code: "membership_already_exists"
                        message: "User already has membership in this project."
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/members/{user_id}/permissions:
    get:
      summary: Get user's effective permissions
      description: |
        Resolve effective permissions for a user in a project (combines explicit + implicit access).

        **Permission Required:** `projects.view_members` (viewer+)
        **Rate Limit:** 200 requests/minute (per user)

        **Resolution Order:**
        1. Check explicit ProjectMembership (if exists, return that role)
        2. Check if private project (if yes, deny access)
        3. Check OrganizationMembership (use org role as implicit access)
        4. Return "no_access" if none of the above

        **Caching:** Results cached for 300s (invalidated on membership changes)
      operationId: getUserProjectPermissions
      tags:
        - Permissions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Permissions resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      project_id:
                        type: string
                        format: uuid
                      effective_role:
                        type: string
                        enum: [viewer, editor, admin, no_access]
                        description: Resolved role (explicit or implicit)
                      source:
                        type: string
                        enum: [explicit_membership, implicit_org_access, no_access]
                        description: How access was granted
                      permissions:
                        type: array
                        items:
                          type: string
                        description: List of granted permission strings
                        example: ["projects.view", "projects.edit", "projects.delete"]
              examples:
                explicit_admin:
                  value:
                    data:
                      user_id: "u1234567-abcd-ef12-3456-7890abcdef12"
                      project_id: "p1234567-abcd-ef12-3456-7890abcdef12"
                      effective_role: "admin"
                      source: "explicit_membership"
                      permissions: ["projects.view", "projects.edit", "projects.delete", "projects.manage_members", "projects.view_members"]
                implicit_viewer:
                  value:
                    data:
                      user_id: "u2345678-bcde-f123-4567-890abcdef123"
                      project_id: "p1234567-abcd-ef12-3456-7890abcdef12"
                      effective_role: "viewer"
                      source: "implicit_org_access"
                      permissions: ["projects.view", "projects.view_members"]
                no_access:
                  value:
                    data:
                      user_id: "u3456789-cdef-1234-5678-90abcdef1234"
                      project_id: "p1234567-abcd-ef12-3456-7890abcdef12"
                      effective_role: "no_access"
                      source: "no_access"
                      permissions: []
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserOrProjectNotFound'

  /projects/{project_id}/searchable-users:
    get:
      summary: Search users for membership
      description: |
        Search for users who can be added to the project.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 100 requests/minute (per user)

        **Behavior:**
        - Returns users based on feature flag `project_access_control.external_user_discovery`
        - If enabled: All org members + external users (email search)
        - If disabled: Only org members
        - Excludes users who already have explicit membership

        **Privacy:** External users only discoverable by exact email match (not partial)
      operationId: searchUsersForMembership
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (name/email for org members, exact email for external)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchableUser'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                org_members_only:
                  value:
                    data:
                      - id: "u4567890-def1-2345-6789-0abcdef12345"
                        email: "frank@example.com"
                        full_name: "Frank Lee"
                        is_org_member: true
                        current_membership: null
                      - id: "u5678901-ef12-3456-7890-abcdef123456"
                        email: "grace@example.com"
                        full_name: "Grace Kim"
                        is_org_member: true
                        current_membership: null
                    meta:
                      pagination:
                        page: 1
                        page_size: 10
                        total_pages: 1
                        total_count: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID

    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User UUID

  schemas:
    ProjectMembershipRead:
      type: object
      required:
        - id
        - user
        - role
        - assignment_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Membership UUID
        user:
          type: object
          required:
            - id
            - email
            - full_name
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            full_name:
              type: string
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Project role
        assignment_reason:
          type: string
          enum: [manual, invitation, promotion, org_default]
          description: How membership was created
        created_at:
          type: string
          format: date-time
          description: Membership creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ProjectMembershipCreate:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
          description: User to add
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Role to assign

    ProjectMembershipUpdate:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [viewer, editor, admin]
          description: New role (may require promotion approval for admin)

    SearchableUser:
      type: object
      required:
        - id
        - email
        - full_name
        - is_org_member
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        is_org_member:
          type: boolean
          description: Whether user is in the project's organization
        current_membership:
          type: string
          enum: [viewer, editor, admin]
          nullable: true
          description: Existing project role (null if not a member)

    PaginationMeta:
      type: object
      required:
        - pagination
      properties:
        pagination:
          type: object
          required:
            - page
            - page_size
            - total_pages
            - total_count
          properties:
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              minimum: 1
            total_pages:
              type: integer
              minimum: 0
            total_count:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                description: Machine-readable error code
              message:
                type: string
                description: Human-readable error message
              field:
                type: string
                description: Field name (for validation errors)

  responses:
    BadRequest:
      description: Bad request (invalid parameters)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_uuid:
              value:
                errors:
                  - code: "invalid_uuid"
                    message: "Invalid UUID format for project_id."
                    field: "project_id"

    Forbidden:
      description: Forbidden (insufficient permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            no_permission:
              value:
                errors:
                  - code: "permission_denied"
                    message: "You do not have permission to manage members for this project."

    ProjectNotFound:
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                errors:
                  - code: "project_not_found"
                    message: "Project with ID p1234567-abcd-ef12-3456-7890abcdef12 does not exist."
                    field: "project_id"

    UserOrProjectNotFound:
      description: User or project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            user_not_found:
              value:
                errors:
                  - code: "user_not_found"
                    message: "User with ID u1234567-abcd-ef12-3456-7890abcdef12 does not exist."
                    field: "user_id"

    MembershipNotFound:
      description: Membership not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                errors:
                  - code: "membership_not_found"
                    message: "User u1234567-abcd-ef12-3456-7890abcdef12 is not a member of project p1234567-abcd-ef12-3456-7890abcdef12."

    MembershipAlreadyExists:
      description: Membership already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicate:
              value:
                errors:
                  - code: "membership_already_exists"
                    message: "User already has membership in this project. Use PATCH to update role."

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_role:
              value:
                errors:
                  - code: "invalid_choice"
                    message: "Invalid role. Must be one of: viewer, editor, admin."
                    field: "role"
            last_admin:
              value:
                errors:
                  - code: "last_admin_protection"
                    message: "Cannot demote or remove the last admin from the project."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication endpoint

    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django session cookie

security:
  - BearerAuth: []
  - SessionAuth: []
