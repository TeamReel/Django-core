openapi: 3.1.0
info:
  title: Project Invitation API
  version: 1.0.0
  description: |
    API endpoints for managing project invitations (invite external/org users to projects).
    Part of B26 Project-Level Access Control feature.

    **Key Capabilities:**
    - Send invitations via email (with magic link)
    - Accept/decline invitations
    - List pending invitations (for project admins)
    - Cancel invitations
    - Automatic expiry after 7 days

    **Integrations:**
    - B16 Notifications (email dispatch via Celery)
    - B09 Audit Logging (invitation lifecycle events)
    - B10 Feature Flags (`project_access_control.require_invitation`)

servers:
  - url: https://api.core-app.railway.app/api/v1
    description: Production (Railway)
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Invitations
    description: Invitation lifecycle management

paths:
  /projects/{project_id}/invitations:
    get:
      summary: List project invitations
      description: |
        Retrieve all pending invitations for a project.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 100 requests/minute (per user)
      operationId: listProjectInvitations
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, cancelled, expired]
          description: "Filter by status (default: pending)"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectInvitationRead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              examples:
                pending_invitations:
                  value:
                    data:
                      - id: "i1234567-abcd-ef12-3456-7890abcdef12"
                        email: "henry@external.com"
                        role: "editor"
                        status: "pending"
                        invited_by:
                          id: "u1234567-abcd-ef12-3456-7890abcdef12"
                          full_name: "Alice Johnson"
                        created_at: "2026-01-03T14:00:00Z"
                        expires_at: "2026-01-10T14:00:00Z"
                    meta:
                      pagination:
                        page: 1
                        page_size: 25
                        total_pages: 1
                        total_count: 1
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

    post:
      summary: Send project invitation
      description: |
        Invite a user to join the project via email.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 20 requests/minute (per user)

        **Behavior:**
        - Generates secure token (32 bytes, URL-safe)
        - Sends email with magic link: `/accept-invitation/{token}`
        - Expires after 7 days (configurable via feature flag)
        - If user already has membership: Returns 409 Conflict
        - If invitation already pending: Resends email with same token

        **Audit Event:** `project.invite.sent`
      operationId: sendProjectInvitation
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInvitationCreate'
            examples:
              invite_editor:
                summary: Invite external user as editor
                value:
                  email: "henry@external.com"
                  role: "editor"
      responses:
        '201':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectInvitationRead'
              examples:
                success:
                  value:
                    data:
                      id: "i1234567-abcd-ef12-3456-7890abcdef12"
                      email: "henry@external.com"
                      role: "editor"
                      status: "pending"
                      invited_by:
                        id: "u1234567-abcd-ef12-3456-7890abcdef12"
                        full_name: "Alice Johnson"
                      created_at: "2026-01-04T12:00:00Z"
                      expires_at: "2026-01-11T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: User already has membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_member:
                  value:
                    errors:
                      - code: "membership_already_exists"
                        message: "User henry@external.com already has membership in this project."
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{project_id}/invitations/{invitation_id}:
    get:
      summary: Get invitation details
      description: |
        Retrieve details of a specific invitation.

        **Permission Required:** `projects.manage_members` (admin only) OR invited user (via token)
        **Rate Limit:** 100 requests/minute (per user)
      operationId: getProjectInvitation
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectInvitationRead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'

    delete:
      summary: Cancel invitation
      description: |
        Cancel a pending invitation.

        **Permission Required:** `projects.manage_members` (admin only)
        **Rate Limit:** 30 requests/minute (per user)

        **Behavior:**
        - Sets status to "cancelled"
        - Invalidates token (future accept attempts will fail)
        - Does NOT send notification to invitee

        **Audit Event:** `project.invite.cancelled`
      operationId: cancelProjectInvitation
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Invitation cancelled successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '422':
          description: Cannot cancel (already accepted/expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_accepted:
                  value:
                    errors:
                      - code: "invalid_state_transition"
                        message: "Cannot cancel invitation that has already been accepted."

  /invitations/{token}:
    get:
      summary: Get invitation by token
      description: |
        Retrieve invitation details using the magic link token.
        Used by frontend when user clicks invitation link.

        **Permission Required:** None (public endpoint, token-gated)
        **Rate Limit:** 50 requests/minute (per IP)

        **Security:** Token is single-use and expires after 7 days.
      operationId: getInvitationByToken
      tags:
        - Invitations
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 64
          description: Invitation token from magic link
      responses:
        '200':
          description: Invitation found and valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectInvitationPublicRead'
              examples:
                valid_invitation:
                  value:
                    data:
                      project:
                        id: "p1234567-abcd-ef12-3456-7890abcdef12"
                        name: "Premier League 2025/26"
                        organization:
                          id: "o1234567-abcd-ef12-3456-7890abcdef12"
                          name: "English Football Association"
                      role: "editor"
                      invited_by:
                        full_name: "Alice Johnson"
                      expires_at: "2026-01-11T12:00:00Z"
        '404':
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  value:
                    errors:
                      - code: "invitation_not_found"
                        message: "Invitation token is invalid or has expired."

    post:
      summary: Accept invitation
      description: |
        Accept a project invitation using the magic link token.

        **Permission Required:** Authenticated user (must match invited email OR be org member)
        **Rate Limit:** 20 requests/minute (per user)

        **Behavior:**
        - Creates ProjectMembership with assignment_reason="invitation"
        - Sets invitation status to "accepted"
        - Invalidates token
        - Sends notification to project admins

        **Audit Events:** `project.invite.accepted`, `project.membership.created`
      operationId: acceptProjectInvitation
      tags:
        - Invitations
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Invitation token
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      membership_id:
                        type: string
                        format: uuid
                        description: Created membership ID
                      project:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                      role:
                        type: string
                        enum: [viewer, editor, admin]
              examples:
                accepted:
                  value:
                    data:
                      membership_id: "m1234567-abcd-ef12-3456-7890abcdef12"
                      project:
                        id: "p1234567-abcd-ef12-3456-7890abcdef12"
                        name: "Premier League 2025/26"
                      role: "editor"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_authenticated:
                  value:
                    errors:
                      - code: "authentication_required"
                        message: "You must be logged in to accept invitations."
        '403':
          description: Email mismatch or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email_mismatch:
                  value:
                    errors:
                      - code: "email_mismatch"
                        message: "This invitation was sent to henry@external.com but you are logged in as different.user@example.com."
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          description: User already has membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_member:
                  value:
                    errors:
                      - code: "membership_already_exists"
                        message: "You already have membership in this project."

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID

    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UUID

  schemas:
    ProjectInvitationRead:
      type: object
      required:
        - id
        - email
        - role
        - status
        - invited_by
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          description: Invitation UUID
        email:
          type: string
          format: email
          description: Invitee email address
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Role to be assigned upon acceptance
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
          description: Invitation status
        invited_by:
          type: object
          required:
            - id
            - full_name
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
        created_at:
          type: string
          format: date-time
          description: Invitation creation timestamp
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp (7 days from creation)
        accepted_at:
          type: string
          format: date-time
          nullable: true
          description: Acceptance timestamp (null if not accepted)

    ProjectInvitationPublicRead:
      type: object
      required:
        - project
        - role
        - invited_by
        - expires_at
      properties:
        project:
          type: object
          required:
            - id
            - name
            - organization
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            organization:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
        role:
          type: string
          enum: [viewer, editor, admin]
        invited_by:
          type: object
          required:
            - full_name
          properties:
            full_name:
              type: string
        expires_at:
          type: string
          format: date-time

    ProjectInvitationCreate:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: Email address of user to invite
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Role to assign (admin may require promotion approval)

    PaginationMeta:
      type: object
      required:
        - pagination
      properties:
        pagination:
          type: object
          required:
            - page
            - page_size
            - total_pages
            - total_count
          properties:
            page:
              type: integer
              minimum: 1
            page_size:
              type: integer
              minimum: 1
            total_pages:
              type: integer
              minimum: 0
            total_count:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
              message:
                type: string
              field:
                type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ProjectNotFound:
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InvitationNotFound:
      description: Invitation not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                errors:
                  - code: "invitation_not_found"
                    message: "Invitation not found or has expired."

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    SessionAuth:
      type: apiKey
      in: cookie
      name: sessionid

security:
  - BearerAuth: []
  - SessionAuth: []
