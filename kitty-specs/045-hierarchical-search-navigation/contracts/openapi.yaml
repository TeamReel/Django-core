openapi: 3.0.0
info:
  title: Hierarchical Search Extension
  version: 1.0.0
  description: Extension to the Global Search API to support entity-centric navigation.

paths:
  /api/search/:
    get:
      summary: Global Search with Hierarchy
      description: Search across all indexed content, optionally returning a navigation tree for the primary result.
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: true
          description: Search keywords
        - in: query
          name: hierarchy
          schema:
            type: boolean
            default: false
          description: If true, attempts to resolve a navigation hierarchy for the top-ranked anchor result.
      responses:
        '200':
          description: Search results with optional hierarchy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 25
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  hierarchy:
                    $ref: '#/components/schemas/HierarchyResponse'
                    nullable: true

components:
  schemas:
    SearchResult:
      type: object
      description: Standard existing search result (simplified for context).
      additionalProperties: true

    HierarchyResponse:
      type: object
      required:
        - anchor
        - tree
      properties:
        anchor:
          $ref: '#/components/schemas/HierarchyAnchor'
        tree:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyNode'

    HierarchyAnchor:
      type: object
      description: The metadata of the entity chosen as the root of the hierarchy.
      required:
        - id
        - type
        - title
      properties:
        id:
          type: string
        type:
          type: string
          description: "Django ContentType label (e.g., 'projects.Project')"
        title:
          type: string
        url:
          type: string
          format: uri
        score:
          type: number
          description: Relevance score used to select this anchor.

    HierarchyNode:
      type: object
      description: Recursive node structure for the navigation tree.
      required:
        - id
        - type
        - title
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        meta:
          type: object
          description: Arbitrary metadata for frontend display (e.g., status color, icon).
        children:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyNode'
          description: Nested children nodes.
