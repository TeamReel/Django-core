openapi: 3.0.3
info:
  title: User Navigation State API
  version: 1.0.0
  description: API for managing user recents and favorites.

paths:
  /api/v1/navigation/recents/:
    get:
      summary: List Recent Items
      operationId: listRecents
      description: Returns list of recently visited items. Filters inaccessible items responsibly.
      responses:
        '200':
          description: List of recents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavigationItem'
    post:
      summary: Record Visit
      operationId: createRecent
      description: Log a page visit. Moves to top if exists.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationInput'
      responses:
        '201':
          description: Recorded
        '200':
          description: Updated existing

  /api/v1/navigation/favorites/:
    get:
      summary: List Favorites
      operationId: listFavorites
      responses:
        '200':
          description: List of favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavigationItem'
    post:
      summary: Add Favorite
      operationId: createFavorite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationInput'
      responses:
        '201':
          description: Created

  /api/v1/navigation/favorites/{id}/:
    delete:
      summary: Remove Favorite
      operationId: deleteFavorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

components:
  schemas:
    NavigationInput:
      type: object
      required:
        - path
        - label
      properties:
        path:
          type: string
          example: "/projects/123"
        label:
          type: string
          example: "Project Alpha"
        content_type_model:
          type: string
          description: "Model name for GFK (e.g., 'project')"
          example: "project"
        object_id:
          type: string
          format: uuid
        context:
          type: object

    NavigationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        label:
          type: string
        is_accessible:
          type: boolean
          description: "False if user lost access to target object"
        timestamp:
          type: string
          format: date-time
        target:
          type: object
          nullable: true
          description: "Resolved summary of target object (if accessible)"
