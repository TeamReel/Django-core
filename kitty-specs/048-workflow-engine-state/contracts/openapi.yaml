openapi: 3.0.3
info:
  title: Workflow Engine API
  version: 1.0.0
  description: |
    Generic workflow state machine for business processes (approvals, status transitions).

    **Key Concepts**:
    - **WorkflowTemplate**: Admin-defined workflow with states and transitions
    - **WorkflowInstance**: Tracks object progress through workflow states
    - **Actions**: Domain-centric transition triggers (e.g., "submit", "approve")
    - **Permissions**: Project-level role mappings control who can execute actions

servers:
  - url: https://api.example.com/api/workflows
    description: Production
  - url: http://localhost:8000/api/workflows
    description: Development

tags:
  - name: Templates
    description: Workflow template management (admin only)
  - name: Instances
    description: Workflow instance lifecycle
  - name: Transitions
    description: State transition execution and history
  - name: Permissions
    description: Project-specific permission overrides

paths:
  /templates/:
    get:
      tags: [Templates]
      summary: List workflow templates
      description: Returns active workflow templates available for use
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
            default: true
          description: Filter by active status
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Paginated list of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplateList'
      security:
        - BearerAuth: []

    post:
      tags: [Templates]
      summary: Create workflow template
      description: Create new workflow template (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateCreate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /templates/{id}/:
    get:
      tags: [Templates]
      summary: Get template details
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplate'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    patch:
      tags: [Templates]
      summary: Update workflow template
      description: |
        Update template metadata. If active instances exist, requires `force_update=true` query param.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - name: force_update
          in: query
          schema:
            type: boolean
            default: false
          description: Force update despite active instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateUpdate'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplate'
        '400':
          description: Active instances exist (provide force_update=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "15 active instances exist. Use force_update=true to proceed."
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

    delete:
      tags: [Templates]
      summary: Soft-delete template
      description: Sets is_active=false. Does not delete actual record.
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /instances/:
    get:
      tags: [Instances]
      summary: List workflow instances
      description: Returns instances scoped to user's accessible projects
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
        - name: workflow_id
          in: query
          schema:
            type: integer
        - name: current_state
          in: query
          schema:
            type: string
        - name: content_type_id
          in: query
          schema:
            type: integer
        - name: object_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated list of instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceList'
      security:
        - BearerAuth: []

    post:
      tags: [Instances]
      summary: Create workflow instance
      description: Start a new workflow for a content object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInstanceCreate'
      responses:
        '201':
          description: Instance created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

  /instances/{id}/:
    get:
      tags: [Instances]
      summary: Get instance details
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Instance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - BearerAuth: []

    patch:
      tags: [Instances]
      summary: Update instance context
      description: Update context JSON (does not trigger state transition)
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  description: Context updates (merged with existing)
      responses:
        '200':
          description: Context updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '400':
          description: Context exceeds 64KB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version conflict (optimistic locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /instances/{id}/execute/:
    post:
      tags: [Transitions]
      summary: Execute state transition
      description: |
        Trigger a state transition by action name.

        **Flow**:
        1. Validates action exists in workflow
        2. Validates transition allowed from current state
        3. Checks user has required permission
        4. Runs validators (if any)
        5. Fires hooks (on_exit, on_transition, on_enter)
        6. Updates state + records history
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionExecute'
      responses:
        '200':
          description: Transition successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          description: Invalid transition or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version conflict (concurrent transition)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /instances/{id}/history/:
    get:
      tags: [Transitions]
      summary: Get transition history
      description: Returns all transitions for this instance
      parameters:
        - $ref: '#/components/parameters/InstanceId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated transition history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryList'
      security:
        - BearerAuth: []

  /instances/{id}/available-actions/:
    get:
      tags: [Transitions]
      summary: Get available actions
      description: |
        Returns actions user can currently execute based on:
        - Current state
        - User's project membership role
        - Permission overrides
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Available actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                          example: "approve"
                        to_state:
                          type: string
                          example: "approved"
                        required_permission:
                          type: string
                          example: "admin"
                        user_has_permission:
                          type: boolean
      security:
        - BearerAuth: []

  /permissions/:
    get:
      tags: [Permissions]
      summary: List permission overrides
      description: Returns overrides for accessible projects
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
        - name: workflow_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPermissionList'
      security:
        - BearerAuth: []

    post:
      tags: [Permissions]
      summary: Create permission override
      description: Create project-specific permission mapping (project admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionOverrideCreate'
      responses:
        '201':
          description: Override created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverride'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: User is not project admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: []

  /permissions/{id}/:
    get:
      tags: [Permissions]
      summary: Get permission override
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        '200':
          description: Override details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverride'
      security:
        - BearerAuth: []

    patch:
      tags: [Permissions]
      summary: Update permission override
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                required_roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Override updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOverride'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

    delete:
      tags: [Permissions]
      summary: Delete permission override
      description: Removes override, falls back to template default
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        '204':
          description: Override deleted
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    InstanceId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    PermissionId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    WorkflowTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Video Approval Workflow"
        description:
          type: string
        version:
          type: string
          example: "1.0.0"
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkflowTemplateCreate:
      type: object
      required: [name, definition]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
          default: "1.0.0"
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'

    WorkflowTemplateUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'

    WorkflowDefinition:
      type: object
      required: [states, transitions]
      properties:
        states:
          type: array
          items:
            type: object
            required: [name, is_initial, is_terminal]
            properties:
              name:
                type: string
                example: "draft"
              is_initial:
                type: boolean
              is_terminal:
                type: boolean
              metadata:
                type: object
        transitions:
          type: array
          items:
            type: object
            required: [action, from_state, to_state]
            properties:
              action:
                type: string
                example: "submit"
              from_state:
                type: string
                example: "draft"
              to_state:
                type: string
                example: "pending_review"
              required_permission:
                type: string
                default: "member"
                example: "admin"
              validators:
                type: array
                items:
                  type: string
                example: ["video_quality_check"]
              hooks:
                type: object
                properties:
                  on_exit:
                    type: array
                    items:
                      type: string
                  on_transition:
                    type: array
                    items:
                      type: string
                  on_enter:
                    type: array
                    items:
                      type: string

    WorkflowInstance:
      type: object
      properties:
        id:
          type: integer
        workflow_id:
          type: integer
        workflow:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        workflow_snapshot:
          $ref: '#/components/schemas/WorkflowDefinition'
        project_id:
          type: integer
        content_type_id:
          type: integer
        object_id:
          type: integer
        content_object:
          type: object
          description: Serialized representation of linked object
        current_state:
          type: string
          example: "pending_review"
        context:
          type: object
          example:
            video_id: 123
            priority: "high"
        version:
          type: integer
        created_by:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkflowInstanceCreate:
      type: object
      required: [workflow_id, project_id, content_type_id, object_id]
      properties:
        workflow_id:
          type: integer
        project_id:
          type: integer
        content_type_id:
          type: integer
        object_id:
          type: integer
        context:
          type: object
          description: Initial workflow context (max 64KB)

    TransitionExecute:
      type: object
      required: [action]
      properties:
        action:
          type: string
          example: "approve"
        comment:
          type: string
          example: "Video quality looks good"
        context_updates:
          type: object
          description: Updates to merge into instance.context

    TransitionResult:
      type: object
      properties:
        instance:
          $ref: '#/components/schemas/WorkflowInstance'
        transition_history:
          $ref: '#/components/schemas/TransitionHistory'
        async_tasks:
          type: array
          items:
            type: object
            properties:
              hook_name:
                type: string
              task_id:
                type: string
                format: uuid

    TransitionHistory:
      type: object
      properties:
        id:
          type: integer
        instance_id:
          type: integer
        from_state:
          type: string
        to_state:
          type: string
        action:
          type: string
        actor:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
        comment:
          type: string
        task_id:
          type: string
          format: uuid
          nullable: true
        context_snapshot:
          type: object
        created_at:
          type: string
          format: date-time

    PermissionOverride:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        workflow_id:
          type: integer
        action_name:
          type: string
        required_roles:
          type: array
          items:
            type: string
          example: ["coach", "admin"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PermissionOverrideCreate:
      type: object
      required: [project_id, workflow_id, action_name, required_roles]
      properties:
        project_id:
          type: integer
        workflow_id:
          type: integer
        action_name:
          type: string
        required_roles:
          type: array
          items:
            type: string

    PaginatedTemplateList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplate'

    PaginatedInstanceList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstance'

    PaginatedHistoryList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/TransitionHistory'

    PaginatedPermissionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/PermissionOverride'

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Validation failed"
              details:
                type: object
                example:
                  context: ["Context size exceeds 64KB limit"]

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
