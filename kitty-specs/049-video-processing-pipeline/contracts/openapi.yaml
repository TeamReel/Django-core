openapi: 3.0.3
info:
  title: Video Processing Pipeline API
  description: |
    REST API for video transcoding, thumbnail generation, and composition.
    Part of Django Core-App (B55 module).
  version: 1.0.0
  contact:
    name: TeamReel

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Video Jobs
    description: Video processing job management
  - name: Presets
    description: Encoding preset configurations
  - name: Platforms
    description: Platform export configurations

paths:
  /video/jobs/:
    get:
      tags: [Video Jobs]
      summary: List video jobs
      description: List all video jobs for the current project with pagination and filtering
      operationId: listVideoJobs
      parameters:
        - $ref: '#/components/parameters/ProjectHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
          description: Filter by job status
        - name: job_type
          in: query
          schema:
            $ref: '#/components/schemas/JobType'
          description: Filter by job type
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Items per page
      responses:
        '200':
          description: Paginated list of video jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVideoJobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Video Jobs]
      summary: Create video job
      description: Submit a new video processing job (transcode, thumbnail, or compose)
      operationId: createVideoJob
      parameters:
        - $ref: '#/components/parameters/ProjectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoJobCreate'
      responses:
        '201':
          description: Job created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /video/jobs/{id}/:
    get:
      tags: [Video Jobs]
      summary: Get video job details
      description: Retrieve details of a specific video job including status and output
      operationId: getVideoJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Video job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJobDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Video Jobs]
      summary: Cancel video job
      description: Cancel a queued video job. Processing or completed jobs cannot be cancelled.
      operationId: cancelVideoJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: Job cancelled
        '400':
          description: Job cannot be cancelled (not in queued status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/jobs/{id}/retry/:
    post:
      tags: [Video Jobs]
      summary: Retry failed job
      description: Retry a failed video job. Only failed jobs can be retried.
      operationId: retryVideoJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '400':
          description: Job cannot be retried (not in failed status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/presets/:
    get:
      tags: [Presets]
      summary: List encoding presets
      description: List all available encoding presets (system and custom)
      operationId: listVideoPresets
      responses:
        '200':
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /video/presets/{id}/:
    get:
      tags: [Presets]
      summary: Get preset details
      description: Retrieve details of a specific encoding preset
      operationId: getVideoPreset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPreset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/platforms/:
    get:
      tags: [Platforms]
      summary: List platform export configurations
      description: List all available platform export configurations
      operationId: listPlatformExports
      parameters:
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
          description: Filter by platform
      responses:
        '200':
          description: List of platform exports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    ProjectHeader:
      name: X-Project-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Project ID for scoping

    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Video job ID

  schemas:
    JobType:
      type: string
      enum: [transcode, thumbnail, compose]
      description: Type of video processing job

    JobStatus:
      type: string
      enum: [queued, processing, completed, failed, cancelled]
      description: Current status of the job

    OutputFormat:
      type: string
      enum: [mp4, webm, hls]
      description: Output video format

    Platform:
      type: string
      enum: [instagram, tiktok, youtube, stories]
      description: Target social media platform

    CropStrategy:
      type: string
      enum: [crop, letterbox, fit]
      description: How to fit video to target aspect ratio

    OverlayType:
      type: string
      enum: [logo, watermark, text, intro, outro]
      description: Type of video overlay

    OverlayPosition:
      type: string
      enum: [top-left, top-right, bottom-left, bottom-right, center, custom]
      description: Position of overlay on video

    VideoJobCreate:
      type: object
      required:
        - job_type
        - input_file_id
      properties:
        job_type:
          $ref: '#/components/schemas/JobType'
        input_file_id:
          type: string
          format: uuid
          description: ID of the input file (from B22 File Storage)
        preset_id:
          type: string
          format: uuid
          description: Encoding preset to use (for transcode jobs)
        platform_export_id:
          type: string
          format: uuid
          description: Platform export config to use
        workflow_template_id:
          type: string
          format: uuid
          description: Optional workflow template for approval flow
        config:
          type: object
          description: Job-specific configuration
          properties:
            output_format:
              $ref: '#/components/schemas/OutputFormat'
            quality:
              type: string
              enum: ['1080p', '720p', '480p', 'thumbnail']
            timestamp:
              type: string
              pattern: '^\d{2}:\d{2}:\d{2}$'
              description: Timestamp for thumbnail (HH:MM:SS)
            grid:
              type: object
              properties:
                rows:
                  type: integer
                  minimum: 1
                  maximum: 5
                cols:
                  type: integer
                  minimum: 1
                  maximum: 5
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/OverlayCreate'
          description: Overlays for compose jobs

    OverlayCreate:
      type: object
      required:
        - overlay_type
        - position
      properties:
        overlay_type:
          $ref: '#/components/schemas/OverlayType'
        position:
          $ref: '#/components/schemas/OverlayPosition'
        position_x:
          type: integer
          description: X coordinate (required if position is 'custom')
        position_y:
          type: integer
          description: Y coordinate (required if position is 'custom')
        padding_percent:
          type: integer
          default: 5
          minimum: 0
          maximum: 50
        opacity:
          type: number
          format: float
          default: 1.0
          minimum: 0.0
          maximum: 1.0
        start_time:
          type: number
          format: float
          description: Start time in seconds
        end_time:
          type: number
          format: float
          description: End time in seconds
        z_index:
          type: integer
          default: 0
        asset_file_id:
          type: string
          format: uuid
          description: Asset file for logo/watermark/intro/outro
        content:
          type: object
          description: Type-specific content configuration

    VideoJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        input_file:
          $ref: '#/components/schemas/FileReference'
        output_file:
          $ref: '#/components/schemas/FileReference'
          nullable: true
        preset:
          $ref: '#/components/schemas/PresetReference'
          nullable: true
        error_message:
          type: string
          nullable: true
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    VideoJobDetail:
      allOf:
        - $ref: '#/components/schemas/VideoJob'
        - type: object
          properties:
            config:
              type: object
            metadata:
              type: object
              properties:
                duration_seconds:
                  type: number
                resolution:
                  type: string
                bitrate:
                  type: string
                codec_video:
                  type: string
                codec_audio:
                  type: string
                file_size_bytes:
                  type: integer
                framerate:
                  type: integer
            workflow_instance:
              $ref: '#/components/schemas/WorkflowReference'
              nullable: true
            overlays:
              type: array
              items:
                $ref: '#/components/schemas/VideoOverlay'
            created_by:
              $ref: '#/components/schemas/UserReference'

    VideoOverlay:
      type: object
      properties:
        id:
          type: string
          format: uuid
        overlay_type:
          $ref: '#/components/schemas/OverlayType'
        position:
          $ref: '#/components/schemas/OverlayPosition'
        position_x:
          type: integer
          nullable: true
        position_y:
          type: integer
          nullable: true
        padding_percent:
          type: integer
        opacity:
          type: number
          format: float
        start_time:
          type: number
          nullable: true
        end_time:
          type: number
          nullable: true
        z_index:
          type: integer
        content:
          type: object
        asset_file:
          $ref: '#/components/schemas/FileReference'
          nullable: true

    VideoPreset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        output_format:
          $ref: '#/components/schemas/OutputFormat'
        video_codec:
          type: string
        audio_codec:
          type: string
        resolution:
          type: string
        bitrate_video:
          type: string
          nullable: true
        bitrate_audio:
          type: string
          nullable: true
        framerate:
          type: integer
          nullable: true
        crf:
          type: integer
          nullable: true
        is_system:
          type: boolean

    PlatformExport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        aspect_ratio:
          type: string
        max_duration_seconds:
          type: integer
          nullable: true
        max_file_size_mb:
          type: integer
          nullable: true
        resolution:
          type: string
        preset:
          $ref: '#/components/schemas/PresetReference'
        crop_strategy:
          $ref: '#/components/schemas/CropStrategy'
        is_active:
          type: boolean

    PaginatedVideoJobList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/VideoJob'

    FileReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        url:
          type: string
          format: uri
          description: Presigned URL for download
        size:
          type: integer
        mime_type:
          type: string

    PresetReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    WorkflowReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        current_state:
          type: string
        template_name:
          type: string

    UserReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        code:
          type: string

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: validation_error
        detail:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
